<title>Он — Она</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fbdf2; }
  body {
    position: fixed; inset: 0; cursor: pointer;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  /* подпись к фразе */
  #caption {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    pointer-events: none; white-space: nowrap;
  }
  #caption div {
    padding: .08em .6em .12em; border-radius: 999px; background: rgba(255,255,255,.92);
    font-size: clamp(30px, min(13vh, 11vw), 76px); font-weight: 900;
    box-shadow: 0 6px 18px rgba(0,0,0,.14);
    animation: pop .3s cubic-bezier(.2,1.6,.4,1) both;
  }
  #caption.he div { color: #1565c0; }
  #caption.she div { color: #d81b60; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #hint {
    position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
    bottom: max(4px, env(safe-area-inset-bottom, 0px));
    font-size: clamp(13px, 3.6vh, 17px); font-weight: 700; color: rgba(255,255,255,.9);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }

  /* стартовый экран */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 16px;
  }
  #start h1 {
    margin: 0; font-size: clamp(40px, min(17vh, 14vw), 92px); font-weight: 900; line-height: 1.1;
    text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(0,0,0,.18);
  }
  #start h1 .a { color: #1565c0; }
  #start h1 .b { color: #d81b60; }
  #startBtn {
    background: #ffb300; color: #fff; border: 5px solid #fff; border-radius: 999px;
    font-size: clamp(26px, 9vh, 42px); font-weight: 900; padding: .3em 1.7em;
    box-shadow: 0 7px 0 #e08e00, 0 14px 26px rgba(0,0,0,.2);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.06); } }
</style>

}

function person(o) {
  const hip = -o.leg, sh = hip - o.torso, hy = sh - o.r * 0.82, w = o.w, lw = o.limb;
  const handY = sh + 8 + o.arm;
  const leg = (role, x, color) => `<g data-role="${role}" data-pivot="${x},${hip}">
    <path d="M${x},${hip} L${x},-7" stroke="${color}" stroke-width="${lw}" stroke-linecap="round"/>
    <ellipse cx="${x + 6}" cy="-6" rx="${lw * .95}" ry="6.5" fill="${o.shoe}"/></g>`;
  const arm = (role, x, color, extra = '') => `<g data-role="${role}" data-pivot="${x},${sh + 8}">
    ${extra}
    <path d="M${x},${sh + 8} L${x},${handY}" stroke="${color}" stroke-width="${lw * .82}" stroke-linecap="round"/>
    <circle cx="${x}" cy="${handY}" r="${lw * .52}" fill="${o.skin}"/></g>`;
  const cane = o.cane
    ? `<path d="M${w * .1 + 12},${handY} L${w * .1 + 12},-2 M${w * .1 + 12},${handY} q0,-12 -12,-10" stroke="#6d4c41" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : '';
  const skirt = o.skirt
    ? `<path d="M${-w / 2},${hip - 10} L${w / 2},${hip - 10} L${w / 2 + o.flare},${hip + o.skirt} Q0,${hip + o.skirt + 7} ${-w / 2 - o.flare},${hip + o.skirt} Z" fill="${o.skirtColor || o.shirt}"/>`
    : '';
  return arm('armB', -w * .1, o.sleeveB || o.sleeve) +
    leg('legB', -w * .18, o.pantsB || o.pants) + leg('legF', w * .18, o.pants) +
    `<rect x="${-w / 2}" y="${sh}" width="${w}" height="${hip - sh + 6}" rx="${w * .34}" fill="${o.shirt}"/>` +
    skirt + (o.front ? o.front(sh, hip) : '') +
    head({ ...o, cy: hy }) +
    arm('armF', w * .1, o.sleeve, cane);
}

function wheel(cx, cy, r, tire, spoke) {
  return `<g data-wheel="${cx},${cy}">
    <circle cx="${cx}" cy="${cy}" r="${r - 3}" fill="none" stroke="${tire}" stroke-width="6"/>
    <path d="M${cx - r + 5},${cy} L${cx + r - 5},${cy} M${cx},${cy - r + 5} L${cx},${cy + r - 5}
      M${cx - (r - 5) * .7},${cy - (r - 5) * .7} L${cx + (r - 5) * .7},${cy + (r - 5) * .7}
      M${cx - (r - 5) * .7},${cy + (r - 5) * .7} L${cx + (r - 5) * .7},${cy - (r - 5) * .7}"
      stroke="${spoke}" stroke-width="1.8"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${spoke}"/></g>`;
}

/* ---------- звук (Web Audio): голос и мотоцикл ---------- */
// Голос — главное в игре, поэтому он звучит и при включённом беззвучном режиме iPhone
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

let ac = null, engine = null;
try {
  const C = window.AudioContext || window.webkitAudioContext;
  if (C) ac = new C();
} catch (e) {}

function unlockAudio() {
  try {
    if (ac && ac.state !== 'running') ac.resume();
  } catch (e) {}
}

/* ---------- озвучка: готовые MP3 внутри файла (голос Svetlana) ---------- */
const voices = {};
let voiceSrc = null, wantedPhrase = null;

// в начале MP3 есть тишина; пропускаем её, чтобы голос звучал сразу после нажатия
function firstSound(buf) {
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) {
    if (Math.abs(ch[i]) > 0.01) return Math.max(0, i / buf.sampleRate - 0.01);
  }
  return 0;
}

function stopVoice() {
  wantedPhrase = null;
  if (!voiceSrc) return;
  try { voiceSrc.stop(); } catch (e) {}
  voiceSrc = null;
}

function speak(text) {
  stopVoice();
  const v = voices[text];
  if (!v) { wantedPhrase = text; return; }   // ещё декодируется: сыграем, как только будет готово
  voiceSrc = ac.createBufferSource();
  voiceSrc.buffer = v.buf;
  voiceSrc.connect(ac.destination);
  voiceSrc.start(0, v.offset);
}

if (ac) {
  const data = JSON.parse($('#voiceData').textContent);
  Object.keys(data).forEach(text => {
    const bin = atob(data[text]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer, buf => {
      voices[text] = { buf, offset: firstSound(buf) };
      if (wantedPhrase === text) speak(text);
    }, () => {});
  });
}

function engineStart() {
  if (!ac || engine) return;
  const g = ac.createGain(), f = ac.createBiquadFilter();
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  g.gain.value = 0.0001;
  f.type = 'lowpass'; f.frequency.value = 650;
  o1.type = 'sawtooth'; o1.frequency.value = 70;
  o2.type = 'square'; o2.frequency.value = 35.5;
  lfo.frequency.value = 17; lg.gain.value = 0.03;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination);
  lfo.connect(lg); lg.connect(g.gain);
  o1.start(); o2.start(); lfo.start();
  engine = { g, o1, o2, lfo };
}
function engineTo(freq, vol, time) {
  if (!engine) return;
  const t = ac.currentTime;
  [[engine.o1.frequency, freq], [engine.o2.frequency, freq * .507], [engine.g.gain, vol]].forEach(([p, v]) => {
    p.cancelScheduledValues(t);
    p.setValueAtTime(p.value, t);
    p.linearRampToValueAtTime(v, t + time);
  });
}
function engineStop(time) {
  if (!engine) return;
  const e = engine, t = ac.currentTime;
  engine = null;
  e.g.gain.cancelScheduledValues(t);
  e.g.gain.setValueAtTime(e.g.gain.value, t);
  e.g.gain.linearRampToValueAtTime(0.0001, t + time);
  [e.o1, e.o2, e.lfo].forEach(o => o.stop(t + time + 0.05));
}

/* ---------- сборка анимации персонажа ---------- */
function setupRig(root) {
  const nums = (el, a) => el.getAttribute(a).split(',').map(Number);
  const limbs = [...root.querySelectorAll('[data-role]')].map(el => {
    const [px, py] = nums(el, 'data-pivot');
    return { el, px, py, role: el.getAttribute('data-role'), a: 0 };
  });
  const wheels = [...root.querySelectorAll('[data-wheel]')].map(el => {
    const [cx, cy] = nums(el, 'data-wheel');
    return { el, cx, cy };
  });
  const puffs = [...root.querySelectorAll('[data-puff]')].map(el => {
    const [x, y, i] = nums(el, 'data-puff');
    return { el, x, y, i };
  });
  const legs = [...root.querySelectorAll('[data-leg]')].map(el => {
    const [hx, hy, bx, by, crank, off, l1, l2] = nums(el, 'data-leg');
    return { el, shoe: el.nextElementSibling, hx, hy, bx, by, crank, off, l1, l2 };
  });
  const cranks = [...root.querySelectorAll('[data-crank]')].map(el => {
    const [bx, by, len, off] = nums(el, 'data-crank');
    return { el, bx, by, len, off };
  });
  return { limbs, wheels, puffs, legs, cranks };
}

function drawPedals(rig, angle) {
  for (const c of rig.cranks) {
    const a = angle + c.off;
    c.el.setAttribute('d', `M${c.bx},${c.by} L${(c.bx + c.len * Math.cos(a)).toFixed(1)},${(c.by + c.len * Math.sin(a)).toFixed(1)}`);
  }
  for (const l of rig.legs) {
    const a = angle + l.off;
    const fx = l.bx + l.crank * Math.cos(a), fy = l.by + l.crank * Math.sin(a);
    const dx = fx - l.hx, dy = fy - l.hy, d = Math.hypot(dx, dy);
    const along = (l.l1 * l.l1 - l.l2 * l.l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l.l1 * l.l1 - along * along));
    // колено всегда вперёд по ходу движения
    const kx = l.hx + along * dx / d + h * dy / d, ky = l.hy + along * dy / d - h * dx / d;
    const knee = kx >= l.hx ? [kx, ky] : [l.hx + along * dx / d - h * dy / d, l.hy + along * dy / d + h * dx / d];
    l.el.setAttribute('d', `M${l.hx},${l.hy} L${knee[0].toFixed(1)},${knee[1].toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}`);
    l.shoe.setAttribute('cx', (fx + 4).toFixed(1));
    l.shoe.setAttribute('cy', fy.toFixed(1));
  }
}

/* ---------- ход игры ---------- */
let phase = 'start';          // start | in | idle | out | gone
let idx = -1, cur = null, rig = null;
let T = 0, tPhase = 0, gaitT = 0, x = 0, x0 = 0, wheelA = 0, pedalA = 0, lastX = 0;

const margin = () => 130 * k;

function setCaption(text, he) {
  caption.className = he ? 'he' : 'she';
  const box = caption.firstElementChild;
  box.textContent = text;
  box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
}

function enter() {
  engineStop(0.15);
  cur = CHARACTERS[idx];
  actor.innerHTML = `<g>${cur.svg}</g>`;
  rig = setupRig(actor.firstElementChild);
  phase = 'in'; tPhase = 0;
  x = x0 = lastX = -margin();
  wheelA = 0; pedalA = 0;
  drawPedals(rig, pedalA);
  shadow.removeAttribute('display');
  setCaption(cur.in.say, cur.he);
  speak(cur.in.say);
  if (cur.engine) { engineStart(); engineTo(85, 0.12, 0.2); }
}

function leave() {
  phase = 'out'; tPhase = 0;
  x0 = x;
  setCaption(cur.out.say, cur.he);
  speak(cur.out.say);
  if (cur.engine) { engineStart(); engineTo(190, 0.22, cur.out.dur * 0.8); }
}

let lastTap = -Infinity;
function onTap() {
  const now = performance.now();
  if (now - lastTap < 350) return;
  lastTap = now;
  unlockAudio();
  if (phase === 'start') {
    $('#start').classList.add('hidden');
    caption.classList.remove('hidden');
    hint.classList.remove('hidden');
    idx = 0;
    enter();
  } else if (phase === 'in' || phase === 'idle') {
    leave();
  } else {
    idx = (idx + 1) % CHARACTERS.length;
    enter();
  }
}
// На iOS речь и звук разрешены только из touchend/click, а не из pointerdown
document.addEventListener('touchend', e => { e.preventDefault(); onTap(); }, { passive: false });
document.addEventListener('click', onTap);

function limbTarget(role, g, moving) {
  if (!moving) {
    if (role === 'armF' && !cur.noWave) return (cur.wave || -150) + 15 * Math.sin(T * 7);
    return 0;
  }
  const s = Math.sin(gaitT * g.freq);
  if (g.hops) {
    if (role === 'legF') return g.amp * s;
    if (role === 'legB') return -g.amp * s;
    return role === 'armF' ? -150 : -130;
  }
  if (role === 'legF') return g.amp * s;
  if (role === 'legB') return -g.amp * s;
  if (role === 'armF') return -g.amp * .8 * s;
  return g.amp * .8 * s;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  T += dt;

  for (const c of clouds) {
    const s = c.s * u;
    c.fx -= 8 * s * dt / W;
    if (c.fx * W < -100 * s) c.fx = (W + 100 * s) / W;
    c.el.setAttribute('transform', `translate(${(c.fx * W).toFixed(1)} ${(c.fy * H).toFixed(1)}) scale(${s.toFixed(3)})`);
  }

  if (rig && phase !== 'gone' && phase !== 'start') {
    const step = phase === 'idle' ? null : cur[phase];
    const g = step ? GAITS[step.gait] : GAITS.ride;
    let y = 0;

    if (step) {
      tPhase += dt; gaitT += dt;
      const p = Math.min(1, tPhase / step.dur);
      if (phase === 'in') {
        x = lerp(x0, W / 2, p * (2 - p));
      } else {
        x = lerp(x0, W + margin(), step.accel ? p * p : p);
      }
      y = g.hops
        ? -Math.abs(Math.sin(Math.PI * g.hops * p)) * g.height * k
        : -Math.abs(Math.sin(gaitT * g.freq)) * g.bob * k;
      if (p >= 1) {
        if (phase === 'in') {
          phase = 'idle';
          if (cur.engine) engineTo(42, 0.07, 0.6);
        } else {
          phase = 'gone';
          engineStop(0.5);
          actor.innerHTML = '';
          rig = null;
          shadow.setAttribute('display', 'none');
        }
      }
    } else {
      x = W / 2;
      y = Math.sin(T * 2.5) * k;
    }

    if (rig) {
      if (cur.engine) y += Math.sin(T * 47) * 0.8 * k;

      const moved = (x - lastX) / k;
      lastX = x;
      wheelA += moved / 28 * 57.3;
      pedalA += moved / 30 * 0.62;
      for (const w of rig.wheels) w.el.setAttribute('transform', `rotate(${(wheelA % 360).toFixed(1)} ${w.cx} ${w.cy})`);
      if (rig.legs.length) drawPedals(rig, pedalA);

      const moving = !!step && phase !== 'idle';
      for (const l of rig.limbs) {
        l.a += (limbTarget(l.role, g, moving) - l.a) * Math.min(1, dt * 14);
        l.el.setAttribute('transform', `rotate(${l.a.toFixed(1)} ${l.px} ${l.py})`);
      }
      for (const f of rig.puffs) {
        const q = (T * (phase === 'idle' ? .6 : 1.4) + f.i / 3) % 1;
        f.el.setAttribute('cx', (f.x - q * 50).toFixed(1));
        f.el.setAttribute('cy', (f.y - q * 22).toFixed(1));
        f.el.setAttribute('r', (4 + q * 11).toFixed(1));
        f.el.setAttribute('opacity', (.8 * (1 - q)).toFixed(2));
      }

      actor.firstElementChild.setAttribute('transform', `translate(${x.toFixed(1)} ${(ground + y).toFixed(1)}) scale(${k.toFixed(3)})`);
      const lift = Math.min(1, -y / (70 * k));
      shadow.setAttribute('cx', x.toFixed(1));
      shadow.setAttribute('cy', ground.toFixed(1));
      shadow.setAttribute('rx', ((cur.svg === motorbike || cur.svg === bicycle ? 105 : 50) * k * (1 - lift * .5)).toFixed(1));
      shadow.setAttribute('ry', (8 * k * (1 - lift * .5)).toFixed(1));
    }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopVoice();
    engineStop(0.05);
  }
});

// iOS: без зума, прокрутки и «резинки»
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// иконка для «На экран Домой»
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#90caf9'; g.fillRect(0, 0, 90, 180);
  g.fillStyle = '#f8bbd0'; g.fillRect(90, 0, 90, 180);
  g.font = '900 44px -apple-system, sans-serif'; g.textAlign = 'center';
  g.fillStyle = '#1565c0'; g.fillText('Он', 45, 105);
  g.fillStyle = '#d81b60'; g.fillText('Она', 135, 105);
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
} catch (e) {}

layout();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
