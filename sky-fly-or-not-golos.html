<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Летает? голос">
<meta name="theme-color" content="#4fa8f0">
<title>Летает — не летает? + голос</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4fa8f0; }
  body {
    position: fixed; inset: 0;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  button { -webkit-appearance: none; appearance: none; font-family: inherit; cursor: pointer; }

  /* счёт */
  #hud {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    display: flex; gap: 18px; padding: 6px 18px; border-radius: 999px;
    background: rgba(255,255,255,.4); color: #1d3b5c;
    font-size: clamp(16px, 5vh, 24px); font-weight: 800;
  }

  /* микрофон: пульсирует, пока слушает; подпрыгивает, если нужно нажать */
  #controls {
    position: absolute; left: 0; right: 0; display: flex; justify-content: center;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
  }
  #mic {
    padding: 0; width: clamp(64px, 19vh, 90px); height: clamp(64px, 19vh, 90px); border-radius: 50%;
    border: 5px solid #fff; background: #fff;
    box-shadow: 0 6px 0 #90caf9, 0 10px 18px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
  }
  #mic svg { width: 60%; height: 60%; }
  #mic.listening { background: #ffebee; animation: listen 1.1s ease-out infinite; }
  #mic.need { animation: nudge 1s ease-in-out infinite; }
  #controls.off #mic { filter: saturate(.55) brightness(1.1); transform: scale(.94); }
  @keyframes listen { 0% { box-shadow: 0 0 0 0 rgba(229,57,53,.55); } 100% { box-shadow: 0 0 0 18px rgba(229,57,53,0); } }
  @keyframes nudge { 50% { transform: scale(1.12); } }

  /* что услышал iPhone — подсказка для взрослого */
  #heard {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 52px); padding: 4px 16px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #37474f; white-space: nowrap; pointer-events: none;
    font-size: clamp(15px, 4.5vh, 22px); font-weight: 800;
  }

  /* сообщение о результате */
  #msg {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    pointer-events: none; text-align: center;
  }
  #msg .card {
    background: rgba(255,255,255,.93); border-radius: 28px;
    padding: 14px 34px 12px; box-shadow: 0 12px 30px rgba(0,0,0,.18);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1) both;
  }
  #msg .big { font-size: clamp(34px, 12vh, 64px); font-weight: 900; line-height: 1.1; white-space: nowrap; }
  #msg.good .big { color: #2e7d32; }
  #msg.bad  .big { color: #e65100; }
  #msg .sub  { font-size: clamp(16px, 5vh, 24px); font-weight: 700; color: #37474f; margin-top: 4px; }
  #msg .sub:empty { display: none; }
  /* короткая подсказка во время полёта: меньше и ниже, чтобы не закрывать предмет */
  #msg.toast { top: 64%; }
  #msg.toast .card { padding: 6px 22px; }
  #msg.toast .big { font-size: clamp(22px, 7vh, 36px); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* стартовый экран */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2vh; text-align: center;
  }
  #start h1 {
    margin: 0; color: #fff; font-size: clamp(30px, 11vh, 58px); font-weight: 900;
    text-shadow: 0 4px 0 #2f7fd0, 0 10px 24px rgba(0,0,0,.2);
  }
  #start p {
    margin: 0 0 2vh; color: #fff; font-size: clamp(15px, 4.6vh, 22px); font-weight: 700;
    text-shadow: 0 2px 0 #2f7fd0;
  }
  #startBtn {
    background: #ffb300; color: #fff; border: 5px solid #fff; border-radius: 999px;
    font-size: clamp(26px, 9vh, 42px); font-weight: 900; padding: .3em 1.7em;
    box-shadow: 0 7px 0 #e08e00, 0 14px 26px rgba(0,0,0,.2);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.06); } }

  /* просьба повернуть телефон */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #4fa8f0; color: #fff; font-weight: 800; font-size: 22px;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  #rotate .phone { font-size: 72px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>

function zig(x0, x1, y, h, n) {
  const step = (x1 - x0) / n;

  for (let i = 0; i < n; i++) d += ` L${x0 + step * (i + .5)},${y + h} L${x0 + step * (i + 1)},${y}`;
  return d + 'Z';
}

/* ---------- анимации частей объекта (крылья, винты, хвосты) ---------- */
function setupAnims(root) {
  const fns = [];
  const nums = (el, a) => el.getAttribute(a).split(',').map(Number);
  root.querySelectorAll('[data-flap]').forEach(el => {
    const [py, sp, ph = 0] = nums(el, 'data-flap');
    fns.push(t => el.setAttribute('transform',
      `translate(0 ${py}) scale(1 ${(0.2 + 0.8 * Math.cos(t * sp + ph)).toFixed(3)}) translate(0 ${-py})`));
  });
  root.querySelectorAll('[data-sway]').forEach(el => {
    const [px, py, amp, sp, ph = 0] = nums(el, 'data-sway');
    fns.push(t => el.setAttribute('transform', `rotate(${(amp * Math.sin(t * sp + ph)).toFixed(2)} ${px} ${py})`));
  });
  root.querySelectorAll('[data-spin]').forEach(el => {
    const [cx, cy, sp] = nums(el, 'data-spin');
    fns.push(t => el.setAttribute('transform', `rotate(${(t * sp * 57.3 % 360).toFixed(1)} ${cx} ${cy})`));
  });
  root.querySelectorAll('[data-rotor]').forEach(el => {
    const [cx, sp] = nums(el, 'data-rotor');
    fns.push(t => {
      const s = Math.max(0.12, Math.abs(Math.cos(t * sp)));
      el.setAttribute('transform', `translate(${cx} 0) scale(${s.toFixed(3)} 1) translate(${-cx} 0)`);
    });
  });
  root.querySelectorAll('[data-flicker]').forEach(el => {
    const [px, sp] = nums(el, 'data-flicker');
    fns.push(t => {
      const s = 0.85 + 0.2 * Math.sin(t * sp) + 0.08 * Math.sin(t * sp * 2.7);
      el.setAttribute('transform', `translate(${px} 0) scale(${s.toFixed(3)} 1) translate(${-px} 0)`);
    });
  });
  root.querySelectorAll('[data-puff]').forEach(el => {
    const [x, y, i] = nums(el, 'data-puff');
    fns.push(t => {
      const p = (t * 0.5 + i / 3) % 1;
      el.setAttribute('cx', x + p * 46);
      el.setAttribute('cy', y - p * 34);
      el.setAttribute('r', 5 + p * 12);
      el.setAttribute('opacity', (0.85 * (1 - p)).toFixed(2));
    });
  });
  return fns;
}

/* ---------- звук (Web Audio): голос и эффекты ---------- */
// Режим «playback» (звук при беззвучном режиме) здесь не включаем: он может мешать микрофону
let ac = null;
try {
  const C = window.AudioContext || window.webkitAudioContext;
  if (C) ac = new C();
} catch (e) {}

function unlockAudio() {
  try {
    if (ac && ac.state !== 'running') ac.resume();
  } catch (e) {}
}
function tone(freq, at, dur, type, vol, slideTo) {
  if (!ac) return;
  const t0 = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfxGood = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.22, 'triangle', 0.22));
const sfxBad = () => { tone(330, 0, 0.28, 'sine', 0.25, 230); tone(230, 0.24, 0.4, 'sine', 0.25, 160); };

// фразы озвучки; tools/embed-voice.py берёт их отсюда
const SAY = {
  ask: 'Летает или не летает?',
  good: 'Молодец!',
  retry: 'Попробуй ещё раз.',
};

/* --- озвучка: готовые MP3 внутри файла (голос Svetlana) --- */
const voices = {};
let voiceSrc = null, wantedPhrase = null, wantedEnd = null;

// в начале MP3 есть тишина; пропускаем её, чтобы голос звучал сразу
function firstSound(buf) {
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) {
    if (Math.abs(ch[i]) > 0.01) return Math.max(0, i / buf.sampleRate - 0.01);
  }
  return 0;
}

function stopVoice() {
  wantedPhrase = null; wantedEnd = null;
  if (!voiceSrc) return;
  const src = voiceSrc;
  voiceSrc = null;
  try { src.stop(); } catch (e) {}
}

// onEnd вызывается, только если фразу договорили до конца
function speak(text, onEnd) {
  stopVoice();
  const v = voices[text];
  if (!v) { wantedPhrase = text; wantedEnd = onEnd || null; return; }   // ещё декодируется: сыграем, как только будет готово
  const src = ac.createBufferSource();
  src.buffer = v.buf;
  src.connect(ac.destination);
  if (onEnd) src.onended = () => { if (voiceSrc === src) { voiceSrc = null; onEnd(); } };
  voiceSrc = src;
  src.start(0, v.offset);
}

if (ac) {
  const data = JSON.parse($('#voiceData').textContent);
  Object.keys(data).forEach(text => {
    const bin = atob(data[text]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer, buf => {
      voices[text] = { buf, offset: firstSound(buf) };
      if (wantedPhrase === text) speak(text, wantedEnd);
    }, () => {});
  });
}

/* ---------- ответ голосом: распознавание речи Safari ---------- */
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('#mic'), heard = $('#heard');
// Дети говорят нечётко, поэтому глагол ищем по похожести: сводим путаемые звуки к одному
// и считаем, сколько букв надо поменять. «Не», «нет» и т. п. ищем отдельно.
const YES_FORMS = ['летает', 'летают', 'летит', 'летать', 'бывает', 'бывают', 'умеет', 'может'];
const YES_SHORT = ['да', 'ага', 'угу'];
const NO_SHORT = ['не', 'нет', 'ни', 'неа', 'нее', 'ня', 'нету'];
const SIMILAR = 0.72;  // насколько похоже (1 — точно); ниже за ответ сходили «бегает», «лает», «плавает»
const SOUND = {
  'р': 'л', 'ж': 'ш', 'щ': 'ш', 'ц': 'ч', 'г': 'к', 'х': 'к', 'б': 'п', 'д': 'т', 'в': 'ф',
  'ы': 'и', 'э': 'е', 'ё': 'е', 'о': 'а', 'я': 'а', 'ю': 'у', 'й': '', 'ь': '', 'ъ': '',
};
// повторы схлопываем: дети тянут гласные («лииитает»)
const simplify = w => [...w].map(ch => ch in SOUND ? SOUND[ch] : ch).join('').replace(/(.)\1+/g, '$1');
const YES_SIMPLE = YES_FORMS.map(simplify);

function similarity(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return 1 - row[b.length] / Math.max(a.length, b.length);
}

const isVerb = w => w.length >= 3 && YES_SIMPLE.some(f => similarity(simplify(w), f) >= SIMILAR);

// true — «летает», false — «не летает», null — не разобрали (тогда не ругаем, а слушаем дальше)
function decide(text) {
  const words = text.toLowerCase().replace(/ё/g, 'е').split(/[^а-я]+/).filter(Boolean);
  if (words.some(w => /^з?на(ю|ет)$/.test(w))) return null;   // «не знаю» — не ответ
  let neg = false, yes = false;
  for (const w of words) {
    const c = w.replace(/(.)\1+/g, '$1');   // «нееет» → «нет»
    if (NO_SHORT.includes(c)) neg = true;
    else if (/^(не|ни|ня)/.test(w) && w.length > 4 && isVerb(w.slice(2))) neg = true;   // «нелетает»
    else if (YES_SHORT.includes(c) || isVerb(w)) yes = true;
  }
  return neg ? false : yes ? true : null;
}

let rec = null, listenWanted = false, needTap = false, heardUntil = 0;

function showHeard(text) {
  heard.textContent = text;
  heard.classList.remove('hidden');
  heardUntil = T + 3;
}

function startListening() {
  if (!Recognition || mode !== 'flying') return;
  listenWanted = true;
  if (rec) return;
  const r = new Recognition();
  r.lang = 'ru-RU';
  r.interimResults = true;
  r.maxAlternatives = 5;
  r.continuous = false;
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      showHeard('🎤 ' + res[0].transcript);
      if (!res.isFinal) continue;   // «не» может прийти позже — ждём конца фразы
      for (let j = 0; j < res.length; j++) {
        const d = decide(res[j].transcript);
        if (d !== null) { stopListening(); voiceAnswer(d); return; }
      }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      listenWanted = false;
      needTap = true;
      mic.classList.add('need');
    }
  };
  r.onend = () => {
    if (rec !== r) return;
    rec = null;
    mic.classList.remove('listening');
    // Safari сам останавливается после паузы — слушаем снова, пока нет ответа
    if (listenWanted) setTimeout(() => { if (listenWanted && !rec) startListening(); }, 300);
  };
  try {
    r.start();
    rec = r;
    mic.classList.add('listening');
  } catch (e) {
    needTap = true;
    mic.classList.add('need');
  }
}

function stopListening() {
  listenWanted = false;
  if (!rec) return;
  const r = rec;
  rec = null;
  mic.classList.remove('listening');
  try { r.abort(); } catch (e) {}
}

// после вопроса слушаем сами; если Safari не разрешает без касания — ждём нажатия на микрофон
const listenAfterVoice = () => { if (!needTap) startListening(); };

function micTap() {
  unlockAudio();
  needTap = false;
  mic.classList.remove('need');
  if (mode === 'flying') { stopVoice(); startListening(); }
}
if (!Recognition) mic.classList.add('hidden');
mic.addEventListener('click', e => { e.stopPropagation(); micTap(); });
mic.addEventListener('touchend', e => { e.preventDefault(); micTap(); }, { passive: false });

/* ---------- игра ---------- */
const score = { ok: 0, bad: 0 };
let mode = 'start';          // start | flying | result
let T = 0;                   // игровое время (стоит на паузе в портрете)
let obj = null, objEl = null, anims = [];
let flightT = 0, baseFrac = 0.5, k = 1, margin = 0;
let pos = { x: 0, y: 0, rot: 0 }, fall = null, nextAt = 0, missed = false, msgHideAt = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let bag = [], lastId = null;
function nextObj() {
  if (!bag.length) {
    bag = shuffle(OBJECTS.slice());
    if (bag[bag.length - 1].id === lastId) bag.unshift(bag.pop());
  }
  const o = bag.pop(); lastId = o.id; return o;
}

function spawn() {
  obj = nextObj();
  actor.innerHTML = `<g>${obj.svg}</g>`;
  objEl = actor.firstElementChild;
  anims = setupAnims(objEl);
  flightT = 0; fall = null;
  baseFrac = rnd(0.15, 0.85);
  mode = 'flying';
  missed = false; msgHideAt = 0;
  controls.classList.remove('off');
  msg.classList.add('hidden');
  speak(SAY.ask, listenAfterVoice);
}

function showMsg(good, sub, toast) {
  msg.className = (good ? 'good' : 'bad') + (toast ? ' toast' : '');
  msg.querySelector('.big').textContent = good ? 'Молодец!' : 'Попробуй ещё раз';
  msg.querySelector('.sub').textContent = sub;
  const card = msg.querySelector('.card');
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
}

// неверный ответ не заканчивает раунд: предмет летит дальше, можно ответить ещё раз
function voiceAnswer(v) {
  if (mode !== 'flying') return;
  if (v === obj.flies) { resolve(v); return; }
  if (!missed) {
    missed = true;
    score.bad++;
    $('#bad').textContent = score.bad;
  }
  sfxBad();
  showMsg(false, '', true);
  msgHideAt = T + 1.6;
  speak(SAY.retry, listenAfterVoice);
}

function objScale() {
  return Math.max(0.55, Math.min(1.5, Math.min(H / 420, W / 900))) * 0.95;
}

function flightPos(t) {
  k = objScale();
  margin = 140 * k;
  const amp = 16 * k, w = 2 * Math.PI / 2.6;
  const half = 64 * k;
  const lo = band.top + half + amp, hi = band.bottom - half - amp;
  const baseY = hi > lo ? lo + baseFrac * (hi - lo) : (band.top + band.bottom) / 2;
  const vx = (W + 2 * margin) / DURATION;
  const dy = amp * w * Math.cos(t * w);
  return {
    x: W + margin - t * vx,
    y: baseY + amp * Math.sin(t * w),
    rot: -Math.atan2(dy, vx) * 57.3 * 0.7,
    vx,
  };
}

function resolve(answer) {
  if (mode !== 'flying') return;
  mode = 'result';
  stopListening();
  nextAt = T + 3.6;   // следующий предмет появится сам
  msgHideAt = 0;
  const correct = answer !== null && answer === obj.flies;
  if (correct) score.ok++; else if (!missed) score.bad++;
  $('#ok').textContent = score.ok; $('#bad').textContent = score.bad;

  // показываем правду: летающие улетают, нелетающие падают вниз
  if (answer === null) {
    fall = null;
    objEl.style.display = 'none';
  } else {
    const vx = flightPos(flightT).vx;
    fall = obj.flies
      ? { vx: -vx * 4, vy: -60, g: 0, vr: 0 }
      : { vx: -vx * 0.4, vy: -160, g: 1500, vr: -70 };
  }

  controls.classList.add('off');
  showMsg(correct, obj.say);
  correct ? sfxGood() : sfxBad();
  speak(correct ? SAY.good : SAY.retry);
}

function setTransform() {
  objEl.setAttribute('transform',
    `translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)}) rotate(${pos.rot.toFixed(2)}) scale(${k.toFixed(3)})`);
}

const portrait = window.matchMedia('(orientation: portrait)');
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (portrait.matches) dt = 0;
  T += dt;

  for (const c of clouds) {
    const s = c.s * k0;
    c.fx -= c.v * k0 * dt / W;
    if (c.fx * W < -110 * s) { c.fx = (W + 110 * s) / W; c.fy = rnd(0.08, 0.62); }
    c.el.setAttribute('transform', `translate(${(c.fx * W).toFixed(1)} ${(c.fy * H).toFixed(1)}) scale(${s.toFixed(3)})`);
  }
  raysG.setAttribute('transform', `rotate(${(T * 12 % 360).toFixed(1)})`);

  if (mode === 'flying') {
    flightT += dt;
    if (flightT >= DURATION) {
      resolve(null);
    } else {
      const p = flightPos(flightT);
      pos.x = p.x; pos.y = p.y; pos.rot = p.rot;
      setTransform();
    }
  } else if (mode === 'result' && fall) {
    fall.vy += fall.g * dt;
    pos.x += fall.vx * dt; pos.y += fall.vy * dt;
    pos.rot += (fall.vr ? fall.vr * dt : (6 - pos.rot) * Math.min(1, dt * 4));
    setTransform();
    if (pos.y > H + 200 || pos.x < -margin) { fall = null; objEl.style.display = 'none'; }
  }

  if (mode === 'result' && T >= nextAt) spawn();
  if (msgHideAt && T > msgHideAt) { msgHideAt = 0; if (mode === 'flying') msg.classList.add('hidden'); }
  if (heardUntil && T > heardUntil) { heard.classList.add('hidden'); heardUntil = 0; }

  for (const f of anims) f(T);
  requestAnimationFrame(frame);
}

/* ---------- ввод ---------- */
document.addEventListener('pointerup', unlockAudio);
// для проверки на компьютере: Y — «летает», N — «не летает»
document.addEventListener('keydown', e => {
  if (e.key === 'y') voiceAnswer(true);
  if (e.key === 'n') voiceAnswer(false);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopListening(); stopVoice(); }
});

$('#startBtn').addEventListener('click', () => {
  unlockAudio();
  $('#start').classList.add('hidden');
  hud.classList.remove('hidden');
  controls.classList.remove('hidden');
  layout();
  spawn();
});

// iOS: без зума, прокрутки и «резинки»
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

window.__state = () => ({ mode, id: obj && obj.id, flies: obj && obj.flies, ok: score.ok, bad: score.bad });   // для автотестов

// иконка для «На экран Домой»
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 180);
  gr.addColorStop(0, '#4fa8f0'); gr.addColorStop(1, '#c4e8ff');
  g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
  g.fillStyle = '#ffd54f'; g.beginPath(); g.arc(142, 38, 20, 0, 7); g.fill();
  g.fillStyle = '#fff';
  [[52, 132, 24], [84, 118, 30], [116, 134, 22]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  g.fillRect(52, 130, 64, 26);
  g.fillStyle = '#2f6fd6'; g.font = '900 86px -apple-system, sans-serif'; g.textAlign = 'center';
  g.fillText('?', 84, 100);
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
} catch (e) {}

layout();
requestAnimationFrame(frame);
})();
</script>
