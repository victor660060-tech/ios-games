<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Летает?">
<meta name="theme-color" content="#4fa8f0">
<title>Летает — не летает</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4fa8f0; }
  body {
    position: fixed; inset: 0;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  button { -webkit-appearance: none; appearance: none; font-family: inherit; cursor: pointer; }

  /* счёт */
  #hud {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    display: flex; gap: 18px; padding: 6px 18px; border-radius: 999px;
    background: rgba(255,255,255,.4); color: #1d3b5c;
    font-size: clamp(16px, 5vh, 24px); font-weight: 800;
  }

  /* кнопки ответа */
  #controls {
    position: absolute; left: 0; right: 0;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding: 0 calc(env(safe-area-inset-right, 0px) + 16px) 0 calc(env(safe-area-inset-left, 0px) + 16px);
    display: flex; justify-content: center; gap: 7vw;
  }
  .btn {
    min-width: 28vw; padding: .45em 1.2em; border-radius: 999px;
    border: 4px solid #fff; color: #fff; font-weight: 900;
    font-size: clamp(20px, 6.6vh, 32px);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    transition: transform .08s, box-shadow .08s, opacity .2s, filter .2s;
  }
  .btn.yes { background: #43a047; box-shadow: 0 6px 0 #2e7d32, 0 10px 18px rgba(0,0,0,.18); }
  .btn.no  { background: #e53935; box-shadow: 0 6px 0 #b71c1c, 0 10px 18px rgba(0,0,0,.18); }
  .btn.down { transform: translateY(4px); }
  .btn.yes.down { box-shadow: 0 2px 0 #2e7d32; }
  .btn.no.down  { box-shadow: 0 2px 0 #b71c1c; }
  #controls.off .btn { opacity: .4; filter: saturate(.5); }
  #controls.off .btn.right { opacity: 1; filter: none; animation: glow 1s ease-out infinite; }
  @keyframes glow {
    0%   { outline: 0 solid rgba(255,255,255,.9); outline-offset: 0; }
    100% { outline: 10px solid rgba(255,255,255,0); outline-offset: 6px; }
  }

  /* сообщение о результате */
  #msg {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    pointer-events: none; text-align: center;
  }
  #msg .card {
    background: rgba(255,255,255,.93); border-radius: 28px;
    padding: 14px 34px 12px; box-shadow: 0 12px 30px rgba(0,0,0,.18);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1) both;
  }
  #msg .big { font-size: clamp(34px, 12vh, 64px); font-weight: 900; line-height: 1.1; white-space: nowrap; }
  #msg.good .big { color: #2e7d32; }
  #msg.bad  .big { color: #e65100; }
  #msg .sub  { font-size: clamp(16px, 5vh, 24px); font-weight: 700; color: #37474f; margin-top: 4px; }
  #msg .hint { font-size: clamp(13px, 3.6vh, 17px); color: #78909c; margin-top: 8px; animation: fadeIn .4s .7s both, blink 1.6s 1.1s infinite; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: .35; } }

  /* стартовый экран */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2vh; text-align: center;
  }
  #start h1 {
    margin: 0; color: #fff; font-size: clamp(30px, 11vh, 58px); font-weight: 900;
    text-shadow: 0 4px 0 #2f7fd0, 0 10px 24px rgba(0,0,0,.2);
  }
  #start p {
    margin: 0 0 2vh; color: #fff; font-size: clamp(15px, 4.6vh, 22px); font-weight: 700;
    text-shadow: 0 2px 0 #2f7fd0;
  }
  #startBtn {
    background: #ffb300; color: #fff; border: 5px solid #fff; border-radius: 999px;
    font-size: clamp(26px, 9vh, 42px); font-weight: 900; padding: .3em 1.7em;
    box-shadow: 0 7px 0 #e08e00, 0 14px 26px rgba(0,0,0,.2);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.06); } }

  /* просьба повернуть телефон */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #4fa8f0; color: #fff; font-weight: 800; font-size: 22px;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  #rotate .phone { font-size: 72px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>

  const step = (x1 - x0) / n;
  let d = `M${x0},${y}`;
  for (let i = 0; i < n; i++) d += ` L${x0 + step * (i + .5)},${y + h} L${x0 + step * (i + 1)},${y}`;
  return d + 'Z';
}
// гребень на спине крокодила

  let d = '';

  return d;
}

/* ---------- анимации частей объекта (крылья, винты, хвосты) ---------- */
function setupAnims(root) {
  const fns = [];
  const nums = (el, a) => el.getAttribute(a).split(',').map(Number);
  root.querySelectorAll('[data-flap]').forEach(el => {
    const [py, sp, ph = 0] = nums(el, 'data-flap');
    fns.push(t => el.setAttribute('transform',
      `translate(0 ${py}) scale(1 ${(0.2 + 0.8 * Math.cos(t * sp + ph)).toFixed(3)}) translate(0 ${-py})`));
  });
  root.querySelectorAll('[data-sway]').forEach(el => {
    const [px, py, amp, sp, ph = 0] = nums(el, 'data-sway');
    fns.push(t => el.setAttribute('transform', `rotate(${(amp * Math.sin(t * sp + ph)).toFixed(2)} ${px} ${py})`));
  });
  root.querySelectorAll('[data-spin]').forEach(el => {
    const [cx, cy, sp] = nums(el, 'data-spin');
    fns.push(t => el.setAttribute('transform', `rotate(${(t * sp * 57.3 % 360).toFixed(1)} ${cx} ${cy})`));
  });
  root.querySelectorAll('[data-rotor]').forEach(el => {
    const [cx, sp] = nums(el, 'data-rotor');
    fns.push(t => {
      const s = Math.max(0.12, Math.abs(Math.cos(t * sp)));
      el.setAttribute('transform', `translate(${cx} 0) scale(${s.toFixed(3)} 1) translate(${-cx} 0)`);
    });
  });
  root.querySelectorAll('[data-puff]').forEach(el => {
    const [x, y, i] = nums(el, 'data-puff');
    fns.push(t => {
      const p = (t * 0.5 + i / 3) % 1;
      el.setAttribute('cx', x + p * 46);
      el.setAttribute('cy', y - p * 34);
      el.setAttribute('r', 5 + p * 12);
      el.setAttribute('opacity', (0.85 * (1 - p)).toFixed(2));
    });
  });
  return fns;
}

/* ---------- сцена ---------- */
const svg = $('#scene'), actor = $('#actor'), cloudsG = $('#clouds'), sunG = $('#sun'), raysG = $('#rays');

const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;' +
  'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const cs = getComputedStyle(probe);
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  k0 = Math.max(0.6, Math.min(1.6, H / 430));
  sunG.setAttribute('transform', `translate(${W - safe.r - 58 * k0} ${54 * k0}) scale(${k0})`);
  band.top = safe.t + 52;
  const ct = controls.classList.contains('hidden') ? H - 90 : controls.getBoundingClientRect().top;
  band.bottom = ct - 8;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

/* ---------- звук (Web Audio, разблокируется по тапу) ---------- */
let ac = null;
function unlockAudio() {
  try {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(freq, at, dur, type, vol, slideTo) {
  if (!ac) return;
  const t0 = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfxGood = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.22, 'triangle', 0.22));
const sfxBad = () => { tone(330, 0, 0.28, 'sine', 0.25, 230); tone(230, 0.24, 0.4, 'sine', 0.25, 160); };

/* ---------- игра ---------- */
const score = { ok: 0, bad: 0 };
let mode = 'start';          // start | flying | result
let T = 0;                   // игровое время (стоит на паузе в портрете)
let obj = null, objEl = null, anims = [];
let flightT = 0, baseFrac = 0.5, k = 1, margin = 0;
let pos = { x: 0, y: 0, rot: 0 }, fall = null, canNextAt = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let bag = [], lastId = null;
function nextObj() {
  if (!bag.length) {
    bag = shuffle(OBJECTS.slice());
    if (bag[bag.length - 1].id === lastId) bag.unshift(bag.pop());
  }
  const o = bag.pop(); lastId = o.id; return o;
}

function spawn() {
  obj = nextObj();
  actor.innerHTML = `<g>${obj.svg}</g>`;
  objEl = actor.firstElementChild;
  anims = setupAnims(objEl);
  flightT = 0; fall = null;
  baseFrac = rnd(0.15, 0.85);
  mode = 'flying';
  controls.classList.remove('off');
  btnYes.classList.remove('right'); btnNo.classList.remove('right');
  msg.classList.add('hidden');
}

function objScale() {
  return Math.max(0.55, Math.min(1.5, Math.min(H / 420, W / 900))) * 0.95;
}

function flightPos(t) {
  k = objScale();
  margin = 140 * k;
  const amp = 16 * k, w = 2 * Math.PI / 2.6;
  const half = 64 * k;
  const lo = band.top + half + amp, hi = band.bottom - half - amp;
  const baseY = hi > lo ? lo + baseFrac * (hi - lo) : (band.top + band.bottom) / 2;
  const vx = (W + 2 * margin) / DURATION;
  const dy = amp * w * Math.cos(t * w);
  return {
    x: W + margin - t * vx,
    y: baseY + amp * Math.sin(t * w),
    rot: -Math.atan2(dy, vx) * 57.3 * 0.7,
    vx,
  };
}

function resolve(answer) {
  if (mode !== 'flying') return;
  mode = 'result';
  canNextAt = T + 0.6;
  const correct = answer !== null && answer === obj.flies;
  if (correct) score.ok++; else score.bad++;
  $('#ok').textContent = score.ok; $('#bad').textContent = score.bad;

  // показываем правду: летающие улетают, нелетающие падают вниз
  if (answer === null) {
    fall = null;
    objEl.style.display = 'none';
  } else {
    const vx = flightPos(flightT).vx;
    fall = obj.flies
      ? { vx: -vx * 4, vy: -60, g: 0, vr: 0 }
      : { vx: -vx * 0.4, vy: -160, g: 1500, vr: -70 };
  }

  controls.classList.add('off');
  (obj.flies ? btnYes : btnNo).classList.add('right');

  msg.className = correct ? 'good' : 'bad';
  msg.querySelector('.big').textContent = correct ? 'Молодец!' : 'Попробуй ещё раз';
  msg.querySelector('.sub').textContent = obj.say;
  const card = msg.querySelector('.card');
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';

  correct ? sfxGood() : sfxBad();
}

function setTransform() {
  objEl.setAttribute('transform',
    `translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)}) rotate(${pos.rot.toFixed(2)}) scale(${k.toFixed(3)})`);
}

const portrait = window.matchMedia('(orientation: portrait)');
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (portrait.matches) dt = 0;
  T += dt;

  for (const c of clouds) {
    const s = c.s * k0;
    c.fx -= c.v * k0 * dt / W;
    if (c.fx * W < -110 * s) { c.fx = (W + 110 * s) / W; c.fy = rnd(0.08, 0.62); }
    c.el.setAttribute('transform', `translate(${(c.fx * W).toFixed(1)} ${(c.fy * H).toFixed(1)}) scale(${s.toFixed(3)})`);
  }
  raysG.setAttribute('transform', `rotate(${(T * 12 % 360).toFixed(1)})`);

  if (mode === 'flying') {
    flightT += dt;
    if (flightT >= DURATION) {
      resolve(null);
    } else {
      const p = flightPos(flightT);
      pos.x = p.x; pos.y = p.y; pos.rot = p.rot;
      setTransform();
    }
  } else if (mode === 'result' && fall) {
    fall.vy += fall.g * dt;
    pos.x += fall.vx * dt; pos.y += fall.vy * dt;
    pos.rot += (fall.vr ? fall.vr * dt : (6 - pos.rot) * Math.min(1, dt * 4));
    setTransform();
    if (pos.y > H + 200 || pos.x < -margin) { fall = null; objEl.style.display = 'none'; }
  }

  for (const f of anims) f(T);
  requestAnimationFrame(frame);
}

/* ---------- ввод ---------- */
function bindAnswer(btn, value) {
  btn.addEventListener('pointerdown', () => {
    if (mode !== 'flying') return;
    btn.classList.add('down');
    resolve(value);
  });
  const up = () => btn.classList.remove('down');
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
}
bindAnswer(btnYes, true);
bindAnswer(btnNo, false);

document.addEventListener('pointerdown', () => {
  if (mode === 'result' && T >= canNextAt) spawn();
});
document.addEventListener('pointerup', unlockAudio);

$('#startBtn').addEventListener('click', () => {
  unlockAudio();
  $('#start').classList.add('hidden');
  hud.classList.remove('hidden');
  controls.classList.remove('hidden');
  layout();
  spawn();
});

// iOS: без зума, прокрутки и «резинки»
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// иконка для «На экран Домой»
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 180);
  gr.addColorStop(0, '#4fa8f0'); gr.addColorStop(1, '#c4e8ff');
  g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
  g.fillStyle = '#ffd54f'; g.beginPath(); g.arc(142, 38, 20, 0, 7); g.fill();
  g.fillStyle = '#fff';
  [[52, 132, 24], [84, 118, 30], [116, 134, 22]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  g.fillRect(52, 130, 64, 26);
  g.fillStyle = '#2f6fd6'; g.font = '900 86px -apple-system, sans-serif'; g.textAlign = 'center';
  g.fillText('?', 84, 100);
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
} catch (e) {}

layout();
requestAnimationFrame(frame);
})();
</script>
