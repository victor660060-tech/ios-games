<title>Какой цвет?</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ede7f6; }
  body {
    position: fixed; inset: 0; cursor: pointer;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  /* микрофон: пульсирует, пока слушает; подпрыгивает, если нужно нажать */
  #controls {
    position: absolute; left: 0; right: 0; display: flex; justify-content: center;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
  }
  #mic {
    -webkit-appearance: none; appearance: none; padding: 0;
    width: clamp(72px, 22vh, 100px); height: clamp(72px, 22vh, 100px); border-radius: 50%;
    border: 5px solid #fff; background: #fff;
    box-shadow: 0 6px 0 #d1c4e9, 0 10px 18px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
  }
  #mic svg { width: 60%; height: 60%; }
  #mic.listening { background: #ffebee; animation: listen 1.1s ease-out infinite; }
  #mic.need { animation: nudge 1s ease-in-out infinite; }
  #controls.off #mic { filter: saturate(.55) brightness(1.1); transform: scale(.94); }
  @keyframes listen { 0% { box-shadow: 0 0 0 0 rgba(229,57,53,.55); } 100% { box-shadow: 0 0 0 18px rgba(229,57,53,0); } }
  @keyframes nudge { 50% { transform: scale(1.12); } }

  /* что услышал iPhone — подсказка для взрослого */
  #heard {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 8px); padding: 4px 16px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #37474f; white-space: nowrap; pointer-events: none;
    font-size: clamp(15px, 4.5vh, 22px); font-weight: 800;
  }

  /* стартовый экран */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 16px;
  }
  #start h1 {
    margin: 0; font-size: clamp(40px, min(17vh, 13vw), 92px); font-weight: 900; line-height: 1.1;
    text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(0,0,0,.12);
  }
  #start .note { margin: 0; color: #5e35b1; font-size: clamp(16px, 5vh, 24px); font-weight: 800; }
  #startBtn {
    background: #ffb300; color: #fff; border: 5px solid #fff; border-radius: 999px;
    font-size: clamp(26px, 9vh, 42px); font-weight: 900; padding: .3em 1.7em;
    box-shadow: 0 7px 0 #e08e00, 0 14px 26px rgba(0,0,0,.2);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.06); } }
</style>
</head>

// круг какого цвета во что превращается; зелёный бывает и огурцом, и крокодилом
const ROUNDS = [
  { color: 'red', obj: 'strawberry' },
  { color: 'green', obj: 'cucumber' },
  { color: 'yellow', obj: 'chick' },
  { color: 'blue', obj: 'whale' },
  { color: 'green', obj: 'croc' },
  { color: 'black', obj: 'kitten' },
];

/* ---------- сцена ---------- */
const svg = $('#scene'), stageG = $('#stage'), dotsG = $('#dots');
const controls = $('#controls');
let W = 0, H = 0, cx = 0, cy = 0, s = 1;

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const micTop = controls.classList.contains('hidden') ? H - 110 : controls.getBoundingClientRect().top;
  const top = 44, avail = micTop - top - 8;
  s = Math.min(avail / 300, W / 330);
  cx = W / 2;
  cy = top + avail * 0.44;
  // разноцветные точки-конфетти на фоне
  const fills = Object.values(COLORS).map(c => c.fill);
  let d = '';
  for (let i = 0; i < 26; i++) {
    const x = ((i * 0.618034) % 1) * W, y = ((i * 0.3819 + 0.13) % 1) * H;
    d += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(4 + (i % 3) * 3) * Math.min(W, H) / 430}" fill="${fills[i % 5]}" opacity=".18"/>`;
  }
  dotsG.innerHTML = d;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

/* ---------- звук (Web Audio): голос и эффекты ---------- */
// Режим «playback» (звук при беззвучном режиме) здесь не включаем: он может мешать микрофону

let ac = null;
try {
  const C = window.AudioContext || window.webkitAudioContext;
  if (C) ac = new C();
} catch (e) {}

function unlockAudio() {
  try {
    if (ac && ac.state !== 'running') ac.resume();
  } catch (e) {}
}

function tone(freq, at, dur, vol, type = 'triangle', slideTo) {
  if (!ac) return;
  const t0 = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(at, dur, vol, freq) {
  if (!ac) return;
  const t0 = ac.currentTime + at, n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t0);
}
const SFX = {
  magic: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .06, .25, .07)),
  peep: () => { tone(2300, 0, .09, .05, 'sine', 3000); tone(2300, .13, .09, .05, 'sine', 3100); },
  snap: () => { noise(0, .05, .35, 2500); tone(140, 0, .08, .15, 'square', 70); },
  spout: () => noise(0, .9, .12, 900),
  boing: () => tone(220, 0, .45, .1, 'sine', 520),
};

/* --- озвучка: готовые MP3 внутри файла (голос Svetlana) --- */
const voices = {};
let voiceSrc = null, wantedPhrase = null, wantedEnd = null;

// в начале MP3 есть тишина; пропускаем её, чтобы голос звучал сразу
function firstSound(buf) {
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) {
    if (Math.abs(ch[i]) > 0.01) return Math.max(0, i / buf.sampleRate - 0.01);
  }
  return 0;
}

function stopVoice() {
  wantedPhrase = null; wantedEnd = null;
  if (!voiceSrc) return;
  const src = voiceSrc;
  voiceSrc = null;
  try { src.stop(); } catch (e) {}
}

// onEnd вызывается, только если фразу договорили до конца
function speak(text, onEnd) {
  stopVoice();
  const v = voices[text];
  if (!v) { wantedPhrase = text; wantedEnd = onEnd || null; return; }   // ещё декодируется: сыграем, как только будет готово
  const src = ac.createBufferSource();
  src.buffer = v.buf;
  src.connect(ac.destination);
  if (onEnd) src.onended = () => { if (voiceSrc === src) { voiceSrc = null; onEnd(); } };
  voiceSrc = src;
  src.start(0, v.offset);
}

if (ac) {
  const data = JSON.parse($('#voiceData').textContent);
  Object.keys(data).forEach(text => {
    const bin = atob(data[text]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer, buf => {
      voices[text] = { buf, offset: firstSound(buf) };
      if (wantedPhrase === text) speak(text, wantedEnd);
    }, () => {});
  });
}

/* ---------- ответ голосом: распознавание речи Safari ---------- */
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('#mic'), heard = $('#heard');
// начала слов; дети говорят нечётко, поэтому есть и похожие варианты («класный», «жолтый»…)
const COLOR_WORDS = {
  red:    ['красн', 'кгасн', 'касн', 'класн'],
  green:  ['зелен', 'зилен', 'зелин', 'зеен', 'зиен'],
  yellow: ['желт', 'жолт', 'зелт', 'жейт', 'жовт'],
  blue:   ['син'],
  black:  ['черн', 'чорн', 'шерн'],
};
let rec = null, listenWanted = false, needTap = false, heardUntil = 0;

// какой цвет назван; null — не разобрали или назвали два цвета (тогда не ругаем, а слушаем дальше)
function decide(text) {
  const words = text.toLowerCase().replace(/ё/g, 'е').split(/[^а-яa-z]+/);
  const found = new Set();
  for (const [color, stems] of Object.entries(COLOR_WORDS)) {
    if (words.some(w => stems.some(st => w.startsWith(st)))) found.add(color);
  }
  return found.size === 1 ? [...found][0] : null;
}

function showHeard(text) {
  heard.textContent = text;
  heard.classList.remove('hidden');
  heardUntil = T + 3;
}

function startListening() {
  if (!Recognition || phase !== 'ask') return;
  listenWanted = true;
  if (rec) return;
  const r = new Recognition();
  r.lang = 'ru-RU';
  r.interimResults = true;
  r.maxAlternatives = 5;
  r.continuous = false;
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      showHeard('🎤 ' + res[0].transcript);
      if (!res.isFinal) continue;
      for (let j = 0; j < res.length; j++) {
        const d = decide(res[j].transcript);
        if (d !== null) { stopListening(); answer(d); return; }
      }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      listenWanted = false;
      needTap = true;
      mic.classList.add('need');
    }
  };
  r.onend = () => {
    if (rec !== r) return;
    rec = null;
    mic.classList.remove('listening');
    // Safari сам останавливается после паузы — слушаем снова, пока нет ответа
    if (listenWanted) setTimeout(() => { if (listenWanted && !rec) startListening(); }, 300);
  };
  try {
    r.start();
    rec = r;
    mic.classList.add('listening');
  } catch (e) {
    needTap = true;
    mic.classList.add('need');
  }
}

function stopListening() {
  listenWanted = false;
  if (!rec) return;
  const r = rec;
  rec = null;
  mic.classList.remove('listening');
  try { r.abort(); } catch (e) {}
}

// после вопроса слушаем сами; если Safari не разрешает без касания — ждём нажатия на микрофон
const listenAfterVoice = () => { if (!needTap) startListening(); };

function micTap() {
  unlockAudio();
  needTap = false;
  mic.classList.remove('need');
  if (phase === 'ask') { stopVoice(); startListening(); }
}
if (!Recognition) mic.classList.add('hidden');
mic.addEventListener('click', e => { e.stopPropagation(); micTap(); });

/* ---------- ход игры ---------- */
// start | appear | ask | reveal | leave
let phase = 'start', T = 0, tP = 0, askAgainAt = 0, shakeT = -1;
let cur = null, parts = {}, sparks = [], fxAt = {};

let bag = [], lastColor = null;
function nextRound() {
  if (!bag.length) {
    // перемешиваем так, чтобы один цвет не шёл два раза подряд
    do {
      bag = ROUNDS.slice();
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    } while (bag.some((r, i) => i > 0 && r.color === bag[i - 1].color) || bag[bag.length - 1].color === lastColor);
  }
  const r = bag.pop(); lastColor = r.color; return r;
}

function buildRound() {
  cur = nextRound();
  const c = COLORS[cur.color];
  stageG.innerHTML = `
    <ellipse data-part="shadow" cx="0" cy="108" rx="78" ry="11" fill="#000" opacity=".1"/>
    <g data-part="ball"><circle r="92" fill="${c.fill}" stroke="#fff" stroke-width="7"/>
      <ellipse cx="-34" cy="-40" rx="26" ry="15" fill="#fff" opacity=".28" transform="rotate(-35 -34 -40)"/></g>
    <g data-part="obj" display="none">${OBJECTS[cur.obj]}</g>
    <text data-part="label" x="0" y="150" text-anchor="middle" display="none"
      font-size="34" font-weight="900" font-family="ui-rounded, -apple-system, sans-serif"
      fill="${c.text || c.fill}" stroke="#fff" stroke-width="8" paint-order="stroke" stroke-linejoin="round">${c.name}</text>
    <g data-part="sparks"></g>`;
  parts = Object.fromEntries([...stageG.querySelectorAll('[data-part]')].map(el => [el.getAttribute('data-part'), el]));
  sparks = []; fxAt = {};
  phase = 'appear'; tP = 0; shakeT = -1;
  controls.classList.add('off');
}

function answer(color) {
  if (phase !== 'ask') return;
  stopListening();
  askAgainAt = T + 12;
  if (color === cur.color) {
    phase = 'reveal'; tP = 0;
    controls.classList.add('off');
    speak(SAY[cur.color]);
    SFX.magic();
    burst();
  } else {
    shakeT = 0;
    speak(SAY.retry, listenAfterVoice);
  }
}

function burst() {
  const fills = ['#ffca28', '#fff', COLORS[cur.color].fill];
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, el = document.createElementNS(SVG_NS, 'path');
    el.setAttribute('d', 'M0,-9 L2.6,-2.6 L9,0 L2.6,2.6 L0,9 L-2.6,2.6 L-9,0 L-2.6,-2.6 Z');
    el.setAttribute('fill', fills[i % 3]);
    parts.sparks.appendChild(el);
    sparks.push({ el, a, v: 120 + (i % 3) * 30 });
  }
}

/* ---------- анимации превращений ---------- */
function setT(el, tr) { if (el) el.setAttribute('transform', tr); }

const ANIM = {
  strawberry(t) {
    const b = Math.abs(Math.sin(t * 5)) * 10;
    setT(parts.obj, `translate(0 ${-b}) rotate(${Math.sin(t * 5) * 4})`);
  },
  cucumber(t) {
    if (!fxAt.boing) { fxAt.boing = 1; SFX.boing(); }
    setT(parts.obj, `rotate(${Math.sin(t * 7) * 10 * Math.max(.3, 1 - t / 3)})`);
  },
  chick(t) {
    const hop = Math.abs(Math.sin(t * 6)) * 14;
    setT(parts.obj, `translate(0 ${-hop})`);
    const w = Math.sin(t * 18) * 14;
    const wl = parts.obj.querySelector('[data-part="wingL"]'), wr = parts.obj.querySelector('[data-part="wingR"]');
    setT(wl, `rotate(${w} -48 10)`); setT(wr, `rotate(${-w} 48 10)`);
    const open = (t % .7) < .25;
    setT(parts.obj.querySelector('[data-part="beakLow"]'), `translate(0 ${open ? 7 : 0})`);
    const k = Math.floor(t / .7);
    if (!fxAt['p' + k] && k < 4) { fxAt['p' + k] = 1; SFX.peep(); }
  },
  whale(t) {
    setT(parts.obj, `translate(0 ${Math.sin(t * 2.2) * 5}) rotate(${Math.sin(t * 2.2) * 2})`);
    setT(parts.obj.querySelector('[data-part="tail"]'), `rotate(${Math.sin(t * 3) * 8} 80 6)`);
    const sp = parts.obj.querySelector('[data-part="spout"]');
    if (t > .3 && !fxAt.spout) { fxAt.spout = 1; SFX.spout(); }
    if (t > 1.8 && !fxAt.spout2) { fxAt.spout2 = 1; SFX.spout(); }
    // фонтан из спины: широкая струя, шапка брызг и капли, падающие в стороны
    let d = '';
    if (t > .3) {
      const grow = clamp01((t - .3) * 3), pulse = 1 + Math.sin(t * 9) * .06;
      const top = -58 - 62 * grow * pulse;
      d += `<path d="M-38,-56 C-40,${(-70 * grow - 56).toFixed(1)} -46,${(top + 8).toFixed(1)} -50,${top.toFixed(1)} L-10,${top.toFixed(1)} C-14,${(top + 8).toFixed(1)} -20,${(-70 * grow - 56).toFixed(1)} -22,-56 Z" fill="#4fc3f7" opacity=".9"/>`;
      for (const [dx, dy, r] of [[-48, 0, 13], [-30, -8, 16], [-12, 0, 13], [-40, 10, 10], [-20, 10, 10]]) {
        d += `<circle cx="${dx}" cy="${(top + dy).toFixed(1)}" r="${(r * grow).toFixed(1)}" fill="#81d4fa"/>`;
      }
      for (let i = 0; i < 14; i++) {
        const q = ((t - .3) * 1.2 + i / 14) % 1;
        const side = i % 2 ? 1 : -1, spread = 30 + (i % 7) * 9;
        const x = -30 + side * spread * q, y = top + 10 - 40 * q + 150 * q * q;
        d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(6 - 3 * q).toFixed(1)}" fill="${i % 3 ? '#29b6f6' : '#b3e5fc'}" opacity="${(grow * (1 - q * .7)).toFixed(2)}"/>`;
      }
    }
    sp.innerHTML = d;
  },
  croc(t) {
    // челюсть: быстро открывается и со щелчком захлопывается
    const cyc = t % .55, k = Math.floor(t / .55);
    const open = cyc < .3 ? Math.sin(cyc / .3 * Math.PI / 2) : Math.max(0, 1 - (cyc - .3) / .06);
    setT(parts.obj.querySelector('[data-part="jaw"]'), `rotate(${-30 * open} 8 24)`);
    if (cyc > .36 && !fxAt['s' + k] && k < 6) { fxAt['s' + k] = 1; SFX.snap(); }
    setT(parts.obj, `translate(0 ${Math.sin(t * 4) * 3})`);
  },
  kitten(t) {
    setT(parts.obj.querySelector('[data-part="tailK"]'), `rotate(${Math.sin(t * 3) * 14} 40 74)`);
    setT(parts.obj.querySelector('[data-part="head"]'), `rotate(${Math.sin(t * 1.6) * 8} 0 10)`);
    const blink = (t % 1.4) > 1.25;
    setT(parts.obj.querySelector('[data-part="eyes"]'), blink ? 'translate(0 -36) scale(1 .12) translate(0 36)' : '');
  },
};

/* ---------- кадр ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  T += dt;
  if (heardUntil && T > heardUntil) { heard.classList.add('hidden'); heardUntil = 0; }
  if (cur) step(dt);
  requestAnimationFrame(frame);
}

function step(dt) {
  tP += dt;
  stageG.setAttribute('transform', `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${s.toFixed(3)})`);
  const breathe = 1 + Math.sin(T * 2.4) * .025;

  if (phase === 'appear') {
    const p = clamp01(tP / .55);
    setT(parts.ball, `scale(${(easeBack(p) * breathe).toFixed(3)})`);
    parts.shadow.setAttribute('opacity', (.1 * p).toFixed(3));
    if (p >= 1) {
      phase = 'ask'; tP = 0;
      controls.classList.remove('off');
      speak(SAY.ask, listenAfterVoice);
      askAgainAt = T + 12;
    }
  } else if (phase === 'ask') {
    let shake = 0;
    if (shakeT >= 0) {
      shakeT += dt;
      shake = Math.sin(shakeT * 40) * 14 * Math.max(0, 1 - shakeT / .6);
      if (shakeT > .6) shakeT = -1;
    }
    setT(parts.ball, `translate(${shake.toFixed(1)} 0) scale(${breathe.toFixed(3)})`);
    if (T > askAgainAt) {   // ребёнок отвлёкся — спросим ещё раз
      stopListening();
      speak(SAY.ask, listenAfterVoice);
      askAgainAt = T + 12;
    }
  } else if (phase === 'reveal') {
    // круг сжимается и закручивается, на его месте вырастает предмет
    const m = clamp01(tP / .6);
    setT(parts.ball, `rotate(${(m * 180).toFixed(1)}) scale(${(1 - m).toFixed(3)})`);
    if (m >= 1) parts.ball.setAttribute('display', 'none');
    if (tP > .25) {
      const g = clamp01((tP - .25) / .5);
      parts.obj.setAttribute('display', 'inline');
      parts.label.setAttribute('display', 'inline');
      parts.label.setAttribute('opacity', g.toFixed(2));
      // анимация задаёт своё движение, а поверх него — рост из точки
      parts.obj.removeAttribute('transform');
      ANIM[cur.obj](tP - .25);
      const inner = parts.obj.getAttribute('transform') || '';
      parts.obj.setAttribute('transform', `scale(${easeBack(g).toFixed(3)}) ${inner}`);
    }
    for (const sp of sparks) {
      const q = clamp01(tP / .9);
      sp.el.setAttribute('transform', `translate(${(Math.cos(sp.a) * sp.v * q).toFixed(1)} ${(Math.sin(sp.a) * sp.v * q).toFixed(1)}) scale(${(1.4 - q).toFixed(2)})`);
      sp.el.setAttribute('opacity', (1 - q).toFixed(2));
    }
    if (tP > 4.4) { phase = 'leave'; tP = 0; }
  } else if (phase === 'leave') {
    const p = clamp01(tP / .4);
    parts.obj.removeAttribute('transform');
    ANIM[cur.obj](4.15 + tP);
    const inner = parts.obj.getAttribute('transform') || '';
    parts.obj.setAttribute('transform', `scale(${(1 - p).toFixed(3)}) ${inner}`);
    parts.label.setAttribute('opacity', (1 - p).toFixed(2));
    parts.shadow.setAttribute('opacity', (.1 * (1 - p)).toFixed(3));
    if (p >= 1) buildRound();
  }
}

/* ---------- старт ---------- */
// На iOS звук разрешается только из touchend/click
function onTap() {
  unlockAudio();
  if (phase !== 'start') return;
  $('#start').classList.add('hidden');
  controls.classList.remove('hidden');
  layout();
  buildRound();
}
document.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.target.closest && e.target.closest('#mic')) micTap(); else onTap();
}, { passive: false });
document.addEventListener('click', onTap);
// для проверки на компьютере: 1–5 — назвать цвет
document.addEventListener('keydown', e => {
  const c = ['red', 'green', 'yellow', 'blue', 'black'][Number(e.key) - 1];
  if (c) answer(c);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopListening(); stopVoice(); }
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// иконка для «На экран Домой»
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#ede7f6'; g.fillRect(0, 0, 180, 180);
  [['#e53935', 52, 52], ['#fdd835', 128, 52], ['#43a047', 52, 128], ['#1e88e5', 128, 128], ['#212121', 90, 90]].forEach(([f, x, y]) => {
    g.fillStyle = f; g.beginPath(); g.arc(x, y, 30, 0, 7); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 5; g.stroke();
  });
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
} catch (e) {}

window.__state = () => ({ phase, color: cur && cur.color, obj: cur && cur.obj });   // для автотестов

layout();
requestAnimationFrame(frame);
})();
</script>
