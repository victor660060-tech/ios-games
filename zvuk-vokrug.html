<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Звук вокруг">
<meta name="theme-color" content="#7e57c2">
<title>Звук вокруг</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7e57c2; }
  body {
    position: fixed; inset: 0;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    background: linear-gradient(160deg, #7e57c2, #5c6bc0);
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  header {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px 2px; color: #fff;
  }
  header h1 { margin: 0; font-size: clamp(20px, 6vh, 28px); font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #pageNo { font-size: clamp(16px, 4.6vh, 22px); font-weight: 800; opacity: .9; }

  /* лента из трёх страниц: предыдущая, текущая, следующая */
  #row { flex: 1; min-height: 0; display: flex; align-items: stretch; }
  #viewport { flex: 1; min-width: 0; overflow: hidden; position: relative; }
  #track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; will-change: transform; }
  #track.anim { transition: transform .32s cubic-bezier(.25,.8,.3,1); }
  .page {
    height: 100%; box-sizing: border-box; padding: 8px 6px 12px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px;
  }
  @media (orientation: portrait) {
    .page { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  }

  .arrow {
    -webkit-appearance: none; appearance: none; flex: none; align-self: center;
    width: 48px; height: 48px; margin: 0 6px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(255,255,255,.25); color: #fff; font-size: 30px; font-weight: 900; line-height: 1;
    font-family: inherit;
  }
  .arrow:active { background: rgba(255,255,255,.45); }

  .card {
    position: relative; min-width: 0; min-height: 0; border-radius: 22px;
    background: var(--bg); box-shadow: 0 5px 0 var(--sh), 0 8px 16px rgba(0,0,0,.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; transition: transform .12s;
  }
  .card.press { transform: scale(.95); }
  .card.playing { box-shadow: 0 0 0 5px #fff, 0 5px 0 var(--sh), 0 8px 22px rgba(0,0,0,.25); }
  .card.loading .icon { opacity: .55; }
  .num {
    position: absolute; top: 7px; left: 9px; padding: 1px 9px; border-radius: 999px;
    background: var(--ac); color: #fff; font-size: clamp(12px, 3.4vh, 16px); font-weight: 900;
  }
  .icon { position: relative; height: 52%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .icon .e, .icon .b { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .icon .e { font-size: min(13vh, 11vw); line-height: 1; }
  .icon svg { width: 92%; height: 92%; }
  .icon .b {
    position: absolute; right: -18%; bottom: -8%; font-size: min(8vh, 6.5vw); line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));
  }
  .card.playing .icon { animation: bob .5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-3%) scale(1.04); } to { transform: translateY(3%) scale(.98); } }
  .name {
    max-width: 92%; margin-top: 4px; text-align: center; color: #37474f;
    font-size: clamp(12px, 3.6vh, 17px); font-weight: 800; line-height: 1.1;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  @media (orientation: portrait) {
    .icon .e { font-size: min(7vh, 17vw); }
    .icon .b { font-size: min(4.4vh, 10vw); }
  }

  /* «волна» звука, пока играет */
  .bars { position: absolute; right: 10px; top: 9px; display: none; gap: 3px; align-items: flex-end; height: 18px; }
  .card.playing .bars { display: flex; }
  .bars i { width: 4px; border-radius: 2px; background: var(--ac); animation: bar .6s ease-in-out infinite alternate; }
  .bars i:nth-child(2) { animation-delay: -.2s; }
  .bars i:nth-child(3) { animation-delay: -.4s; }
  @keyframes bar { from { height: 4px; } to { height: 18px; } }
</style>
</head>

  <h1>Звук вокруг</h1>
  <div id="pageNo"></div>

function iconHtml(s) {
  const main = s[3].startsWith('svg:')
    ? `<svg viewBox="0 0 100 100">${SVG_ICONS[s[3].slice(4)]}</svg>`
    : `<span class="e">${s[3]}</span>`;
  return main + (s[4] ? `<span class="b">${s[4]}</span>` : '');
}

/* ---------- страницы по 8 звуков, листаются по кругу ---------- */
const pages = Math.ceil(SOUNDS.length / PER_PAGE);
const track = $('#track'), viewport = $('#viewport'), pageNo = $('#pageNo');
let page = 0, width = 0, animating = false;
try { page = Math.min(pages - 1, Math.max(0, parseInt(localStorage.getItem('zvuk-page'), 10) || 0)); } catch (e) {}

const wrap = p => (p + pages) % pages;

function pageHtml(p) {
  return `<div class="page">${SOUNDS.slice(p * PER_PAGE, p * PER_PAGE + PER_PAGE).map((s, j) => {
    const [bg, sh, ac] = GROUPS[s[5]];
    const name = s[1][0].toUpperCase() + s[1].slice(1);
    return `<div class="card" data-i="${p * PER_PAGE + j}" style="--bg:${bg};--sh:${sh};--ac:${ac}">
      <span class="num">${s[0]}</span><span class="bars"><i></i><i></i><i></i></span>
      <div class="icon">${iconHtml(s)}</div><div class="name">${name}</div></div>`;
  }).join('')}</div>`;
}

function render() {
  width = viewport.clientWidth;
  track.innerHTML = pageHtml(wrap(page - 1)) + pageHtml(page) + pageHtml(wrap(page + 1));
  for (const el of track.children) el.style.width = width + 'px';
  track.classList.remove('anim');
  setX(0);
  pageNo.textContent = `${page + 1} / ${pages}`;
  markPlaying();
}

function setX(dx) { track.style.transform = `translateX(${-width + dx}px)`; }

function go(dir) {
  if (animating) return;
  stopSound();
  animating = true;
  track.classList.add('anim');
  setX(-dir * width);
  setTimeout(() => {
    page = wrap(page + dir);
    try { localStorage.setItem('zvuk-page', page); } catch (e) {}
    animating = false;
    render();
  }, 330);
}

function snapBack() {
  track.classList.add('anim');
  setX(0);
}

/* ---------- звук ---------- */
const player = new Audio();
player.preload = 'auto';
let playing = -1;

function markPlaying() {
  for (const c of track.querySelectorAll('.card')) {
    const on = Number(c.dataset.i) === playing;
    c.classList.toggle('playing', on && !player.paused);
    c.classList.toggle('loading', on && player.paused);
  }
}

function toggle(i) {
  if (playing === i) { stopSound(); return; }
  playing = i;
  player.src = FOLDER + encodeURIComponent(SOUNDS[i][2]);
  player.currentTime = 0;
  player.play().catch(() => { playing = -1; markPlaying(); });
  markPlaying();
}

function stopSound() {
  if (playing < 0) return;
  playing = -1;
  player.pause();
  markPlaying();
}

player.addEventListener('playing', markPlaying);
player.addEventListener('ended', () => { playing = -1; markPlaying(); });
player.addEventListener('error', () => { playing = -1; markPlaying(); });

/* ---------- касания: листаем пальцем, нажимаем на карточку ---------- */
// Звук на iOS разрешён только из touchend/click, поэтому всё решаем в touchend
let sx = 0, sy = 0, dx = 0, dragging = false, pressed = null, touching = false;

function down(x, y, target) {
  if (animating) return;
  touching = true;
  sx = x; sy = y; dx = 0; dragging = false;
  track.classList.remove('anim');
  pressed = target.closest('.card');
  if (pressed) pressed.classList.add('press');
}
function move(x, y) {
  if (!touching) return;
  dx = x - sx;
  if (!dragging && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(y - sy)) {
    dragging = true;
    if (pressed) pressed.classList.remove('press');
  }
  if (dragging) setX(dx);
}
function up() {
  if (!touching) return;
  touching = false;
  if (pressed) pressed.classList.remove('press');
  if (dragging) {
    if (dx < -width * .18) go(1);
    else if (dx > width * .18) go(-1);
    else snapBack();
  } else if (pressed) {
    toggle(Number(pressed.dataset.i));
  }
  pressed = null;
}

viewport.addEventListener('touchstart', e => { const t = e.touches[0]; down(t.clientX, t.clientY, e.target); }, { passive: true });
viewport.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: false });
viewport.addEventListener('touchend', e => { e.preventDefault(); up(); }, { passive: false });
viewport.addEventListener('touchcancel', () => { touching = false; snapBack(); });
// мышь — для проверки на компьютере
viewport.addEventListener('mousedown', e => down(e.clientX, e.clientY, e.target));
window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
window.addEventListener('mouseup', up);

function onPress(el, fn) {
  el.addEventListener('touchend', e => { e.preventDefault(); fn(); }, { passive: false });
  el.addEventListener('click', fn);
}
onPress($('#prev'), () => go(-1));
onPress($('#next'), () => go(1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

window.addEventListener('resize', render);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSound(); });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

// иконка для «На экран Домой»
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 180, 180);
  gr.addColorStop(0, '#7e57c2'); gr.addColorStop(1, '#5c6bc0');
  g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
  g.strokeStyle = '#fff'; g.lineWidth = 9; g.lineCap = 'round';
  for (const r of [28, 52, 76]) { g.beginPath(); g.arc(60, 90, r, -0.7, 0.7); g.stroke(); }
  g.fillStyle = '#fff'; g.beginPath(); g.arc(60, 90, 12, 0, 7); g.fill();
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
} catch (e) {}

render();
})();
</script>
