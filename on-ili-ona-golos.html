<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Он/она голос">
<meta name="theme-color" content="#6fbdf2">
<title>Он или она? + голос</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fbdf2; }
  body {
    position: fixed; inset: 0; cursor: pointer;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  /* кнопки ответа */
  #controls {
    position: absolute; left: 0; right: 0;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding: 0 calc(env(safe-area-inset-right, 0px) + 16px) 0 calc(env(safe-area-inset-left, 0px) + 16px);
    display: flex; justify-content: center; gap: 5vw;
  }
  .btn {
    -webkit-appearance: none; appearance: none; font-family: inherit;
    min-width: 28vw; padding: .3em 1em; border-radius: 999px;
    border: 5px solid #fff; color: #fff; font-weight: 900;
    font-size: clamp(28px, 9vh, 46px);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    transition: transform .08s, box-shadow .08s, opacity .25s, filter .25s;
  }
  .btn.he  { background: #1e88e5; box-shadow: 0 7px 0 #1565c0, 0 12px 20px rgba(0,0,0,.18); }
  .btn.she { background: #ec407a; box-shadow: 0 7px 0 #c2185b, 0 12px 20px rgba(0,0,0,.18); }
  .btn.down { transform: translateY(5px); }
  .btn.he.down  { box-shadow: 0 2px 0 #1565c0; }
  .btn.she.down { box-shadow: 0 2px 0 #c2185b; }
  /* неактивные кнопки: тот же цвет, только бледнее — полупрозрачность поверх травы меняла бы цвет */
  #controls.off .btn { filter: saturate(.55) brightness(1.18); transform: scale(.94); }

  /* микрофон: пульсирует, пока слушает; подпрыгивает, если нужно нажать */
  #mic {
    -webkit-appearance: none; appearance: none; flex: none; align-self: center; padding: 0;
    width: clamp(56px, 16vh, 76px); height: clamp(56px, 16vh, 76px); border-radius: 50%;
    border: 5px solid #fff; background: #fff;
    box-shadow: 0 6px 0 #cfd8dc, 0 10px 18px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
  }
  #mic svg { width: 60%; height: 60%; }
  #mic.listening { background: #ffebee; animation: listen 1.1s ease-out infinite; }
  #mic.need { animation: nudge 1s ease-in-out infinite; }
  #controls.off #mic { filter: saturate(.55) brightness(1.1); transform: scale(.94); }
  @keyframes listen { 0% { box-shadow: 0 0 0 0 rgba(229,57,53,.55); } 100% { box-shadow: 0 0 0 18px rgba(229,57,53,0); } }
  @keyframes nudge { 50% { transform: scale(1.12); } }

  /* что услышал iPhone — подсказка для взрослого */
  #heard {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 8px); padding: 4px 16px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #37474f; white-space: nowrap; pointer-events: none;
    font-size: clamp(15px, 4.5vh, 22px); font-weight: 800;
  }

  /* стартовый экран */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; text-align: center; padding: 16px;
  }
  #start h1 {
    margin: 0; font-size: clamp(40px, min(17vh, 13vw), 92px); font-weight: 900; line-height: 1.1;
    text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(0,0,0,.18);
  }
  #start h1 .a { color: #1565c0; }
  #start h1 .b { color: #d81b60; }
  #start .note {
    margin: 0; color: #fff; font-size: clamp(16px, 5vh, 24px); font-weight: 800;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  #startBtn {
    background: #ffb300; color: #fff; border: 5px solid #fff; border-radius: 999px;
    font-size: clamp(26px, 9vh, 42px); font-weight: 900; padding: .3em 1.7em;
    box-shadow: 0 7px 0 #e08e00, 0 14px 26px rgba(0,0,0,.2);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.06); } }
</style>
</head>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const SVG_NS = 'http://www.w3.org/2000/svg';
const lerp = (a, b, p) => a + (b - a) * p;

// фразы озвучки; tools/embed-voice.py берёт их отсюда
const SAY = {
  ask: 'Максим, это он или она?',
  retry: 'Попробуй ещё раз.',
  goodHe: 'Правильно! Это он.',
  goodShe: 'Правильно! Это она.',
};

/* ---------- детали рисунка (ноги на y=0, голова в масштабе r=30) ---------- */

const SKIN = '#ffd3b0', SKIN_D = '#efbd98';

const bow = (x, y, c, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}">
    <path d="M0,0 L-13,-9 L-13,9 Z"/><path d="M0,0 L13,-9 L13,9 Z"/><circle r="4"/></g>`;

const CAP_HAIR = 'M-31,2 C-36,-40 34,-42 31,-6 C22,-18 8,-22 -6,-20 C-14,-18 -20,-8 -22,6 Z';
const CAP_FRONT = 'M-31,4 C-35,-38 35,-38 31,4 C28,-10 18,-19 0,-19 C-18,-19 -28,-10 -31,4 Z';

/* --- вид сбоку: персонаж идёт вправо --- */

function head(o) {
  return `<g transform="translate(${o.cx || 0} ${o.cy}) scale(${o.r / 30})">
    ${o.hairB || ''}
    <circle r="30" fill="${o.skin}"/>
    ${o.noEar ? '' : `<circle cx="-16" cy="4" r="6" fill="${o.skin}" stroke="#d9a07e" stroke-width="1.5"/>`}
    <ellipse cx="-3" cy="9" rx="5" ry="3.2" fill="#ff8a80" opacity=".5"/>
    <ellipse cx="24" cy="9" rx="4" ry="3.2" fill="#ff8a80" opacity=".5"/>
    <circle cx="4" cy="-4" r="3.6" fill="#2b2b2b"/><circle cx="5.2" cy="-5.2" r="1.1" fill="#fff"/>
    <circle cx="19" cy="-4" r="3.6" fill="#2b2b2b"/><circle cx="20.2" cy="-5.2" r="1.1" fill="#fff"/>
    <path d="M12,1 q3,4 -1,5" stroke="#c98a68" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M5,13 Q12,20 19,13" stroke="${o.mouth || '#b5533c'}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    ${o.hairF || ''}
  </g>`;
}

function person(o) {
  const hip = -o.leg, sh = hip - o.torso, hy = sh - o.r * 0.82, w = o.w, lw = o.limb;
  const handY = sh + 8 + o.arm;
  const leg = (role, x, color) => `<g data-role="${role}" data-pivot="${x},${hip}">
    <path d="M${x},${hip} L${x},-7" stroke="${color}" stroke-width="${lw}" stroke-linecap="round"/>
    <ellipse cx="${x + 6}" cy="-6" rx="${lw * .95}" ry="6.5" fill="${o.shoe}"/></g>`;
  const arm = (role, x, color, extra = '') => `<g data-role="${role}" data-pivot="${x},${sh + 8}">
    ${extra}
    <path d="M${x},${sh + 8} L${x},${handY}" stroke="${color}" stroke-width="${lw * .82}" stroke-linecap="round"/>
    <circle cx="${x}" cy="${handY}" r="${lw * .52}" fill="${o.skin}"/></g>`;
  const cane = o.cane
    ? `<path d="M${w * .1 + 12},${handY} L${w * .1 + 12},-2 M${w * .1 + 12},${handY} q0,-12 -12,-10" stroke="#6d4c41" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : '';
  const skirt = o.skirt
    ? `<path d="M${-w / 2},${hip - 10} L${w / 2},${hip - 10} L${w / 2 + o.flare},${hip + o.skirt} Q0,${hip + o.skirt + 7} ${-w / 2 - o.flare},${hip + o.skirt} Z" fill="${o.skirtColor || o.shirt}"/>`
    : '';
  return arm('armB', -w * .1, o.sleeveB || o.sleeve) +
    leg('legB', -w * .18, o.pantsB || o.pants) + leg('legF', w * .18, o.pants) +
    `<rect x="${-w / 2}" y="${sh}" width="${w}" height="${hip - sh + 6}" rx="${w * .34}" fill="${o.shirt}"/>` +
    skirt + (o.front ? o.front(sh, hip) : '') +
    head({ ...o, cy: hy }) +
    arm('armF', w * .1, o.sleeve, cane);
}

function headFront(o) {
  const s = o.r / 30, lip = o.mouth || '#b5533c';
  return `<g data-head data-hc="0,${o.cy},${s}">
   <g transform="translate(0 ${o.cy}) scale(${s})">
    ${o.fHairB || ''}
    ${o.noEar ? '' : `<circle cx="-29" cy="4" r="6" fill="${o.skin}" stroke="#d9a07e" stroke-width="1.5"/>
      <circle cx="29" cy="4" r="6" fill="${o.skin}" stroke="#d9a07e" stroke-width="1.5"/>`}
    <circle r="30" fill="${o.skin}"/>
    <ellipse cx="-17" cy="9" rx="5" ry="3.2" fill="#ff8a80" opacity=".5"/>
    <ellipse cx="17" cy="9" rx="5" ry="3.2" fill="#ff8a80" opacity=".5"/>
    <path d="M-2,3 q2,3 4,0" stroke="#c98a68" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    ${o.fHairF || ''}
    <g data-face="smile">${EYES_OPEN}
      <path d="M-7,13 Q0,20 7,13" stroke="${lip}" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>
    <g data-face="joy" display="none">${EYES_HAPPY}
      <path d="M-9,11 Q0,26 9,11 Z" fill="#8d3b2b"/><path d="M-5,18 Q0,22 5,18" stroke="#ef9a9a" stroke-width="3" fill="none"/></g>
    <g data-face="kiss" display="none">${EYES_CLOSED}
      <ellipse cx="0" cy="15" rx="4" ry="4.6" fill="${o.mouth || '#e57373'}"/><ellipse cx="0" cy="15" rx="1.6" ry="2.2" fill="#8d3b2b"/></g>
    <g data-face="sad" display="none">${EYES_DOWN}
      <path d="M-7,18 Q0,11 7,18" stroke="${lip}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <ellipse data-tear cx="-10" cy="4" rx="2.2" ry="3.2" fill="#64b5f6"/></g>
    ${o.fTop || ''}
   </g></g>`;
}

function frontPerson(o) {
  const hip = -o.leg, sh = hip - o.torso, hy = sh - o.r * 0.82, w = o.w, lw = o.limb;
  const lx = w * .24, ua = o.arm * .52, fa = o.arm * .52;
  let legs = '';
  for (const sx of [-1, 1]) {
    if (o.sit) {
      legs += `<path d="M${sx * lx},${hip} L${sx * (lx + o.sitLeg)},-8" stroke="${o.pants}" stroke-width="${lw}" stroke-linecap="round"/>
        <circle cx="${sx * (lx + o.sitLeg + 2)}" cy="-8" r="${lw * .62}" fill="${o.shoe}"/>`;
    } else if (!o.noLegs) {
      legs += `<path d="M${sx * lx},${hip} L${sx * lx},-7" stroke="${o.pants}" stroke-width="${lw}" stroke-linecap="round"/>
        <ellipse cx="${sx * (lx + 2)}" cy="-6" rx="${lw * .85}" ry="6.5" fill="${o.shoe}"/>`;
    }
  }
  const skirt = o.skirt
    ? `<path d="M${-w / 2},${hip - 10} L${w / 2},${hip - 10} L${w / 2 + o.flare},${hip + o.skirt} Q0,${hip + o.skirt + 7} ${-w / 2 - o.flare},${hip + o.skirt} Z" fill="${o.skirtColor || o.shirt}"/>`
    : '';
  const caneX = -w / 2 - 8, caneTop = sh + 8 + o.arm * .85;
  const cane = o.cane
    ? `<path data-cane="${caneX},${caneTop}" d="M${caneX},${caneTop} L${caneX},-2 M${caneX},${caneTop} q0,-11 11,-11" stroke="#6d4c41" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : '';
  // кулак с согнутыми пальцами и большой палец сбоку — именно «класс», а не другой жест
  const thumb = `<g data-thumb display="none"><g transform="scale(${lw / 10.5})" fill="${o.skin}" stroke="#c98a68" stroke-width="1.3" stroke-linejoin="round">
    <path d="M-8,-3 L-8,-12 Q-8,-21 -3.5,-20 Q-1,-19.5 -1,-14 L-1,-3 Z"/>
    <rect x="-9" y="-5" width="17" height="15" rx="5"/>
    <path d="M-1,-1 L7,-1 M-1,3.5 L7,3.5 M-1,7.5 L6,7.5" fill="none" stroke-linecap="round"/></g></g>`;
  const arm = side => {
    const sx = (side === 'L' ? -1 : 1) * (w / 2 - lw * .2);
    return `<path data-arm="${side}" data-sh="${sx},${sh + 8}" data-len="${ua},${fa}" stroke="${o.sleeve}" stroke-width="${lw * .82}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle data-hand="${side}" r="${lw * .52}" fill="${o.skin}"/>${side === 'R' ? thumb : ''}`;
  };
  return `<g data-front data-hip="${hip}" ${o.noLegs ? 'data-lap' : ''}>` + legs +
    `<rect data-torso x="${-w / 2}" y="${sh}" width="${w}" height="${hip - sh + 6}" rx="${w * .34}" fill="${o.shirt}"/>` +
    skirt + (o.fFront ? o.fFront(sh, hip) : '') +
    headFront({ ...o, cy: hy }) + cane + arm('L') + arm('R') + '</g>';
}

function wheel(cx, cy, r, tire, spoke) {
  return `<g data-wheel="${cx},${cy}">
    <circle cx="${cx}" cy="${cy}" r="${r - 3}" fill="none" stroke="${tire}" stroke-width="6"/>
    <path d="M${cx - r + 5},${cy} L${cx + r - 5},${cy} M${cx},${cy - r + 5} L${cx},${cy + r - 5}
      M${cx - (r - 5) * .7},${cy - (r - 5) * .7} L${cx + (r - 5) * .7},${cy + (r - 5) * .7}
      M${cx - (r - 5) * .7},${cy + (r - 5) * .7} L${cx + (r - 5) * .7},${cy - (r - 5) * .7}"
      stroke="${spoke}" stroke-width="1.8"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${spoke}"/></g>`;
}

// персонаж целиком поворачивается: вид сбоку меняется на вид спереди

/* ---------- звук (Web Audio): голос, мотор, «динь» ---------- */
// Режим «playback» (звук при беззвучном режиме) здесь не включаем: он может мешать микрофону

let ac = null, engine = null;
try {
  const C = window.AudioContext || window.webkitAudioContext;
  if (C) ac = new C();
} catch (e) {}

function unlockAudio() {
  try {
    if (ac && ac.state !== 'running') ac.resume();
  } catch (e) {}
}

function tone(freq, at, dur, vol) {
  if (!ac) return;
  const t0 = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfxPop = () => { tone(784, 0, .16, .12); tone(1175, .08, .22, .1); };

/* --- озвучка: готовые MP3 внутри файла (голос Svetlana) --- */
const voices = {};
let voiceSrc = null, wantedPhrase = null, wantedEnd = null;

// в начале MP3 есть тишина; пропускаем её, чтобы голос звучал сразу
function firstSound(buf) {
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) {
    if (Math.abs(ch[i]) > 0.01) return Math.max(0, i / buf.sampleRate - 0.01);
  }
  return 0;
}

function stopVoice() {
  wantedPhrase = null; wantedEnd = null;
  if (!voiceSrc) return;
  const src = voiceSrc;
  voiceSrc = null;
  try { src.stop(); } catch (e) {}
}

// onEnd вызывается, только если фразу договорили до конца
function speak(text, onEnd) {
  stopVoice();
  const v = voices[text];
  if (!v) { wantedPhrase = text; wantedEnd = onEnd || null; return; }   // ещё декодируется: сыграем, как только будет готово
  const src = ac.createBufferSource();
  src.buffer = v.buf;
  src.connect(ac.destination);
  if (onEnd) src.onended = () => { if (voiceSrc === src) { voiceSrc = null; onEnd(); } };
  voiceSrc = src;
  src.start(0, v.offset);
}

if (ac) {
  const data = JSON.parse($('#voiceData').textContent);
  Object.keys(data).forEach(text => {
    const bin = atob(data[text]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer, buf => {
      voices[text] = { buf, offset: firstSound(buf) };
      if (wantedPhrase === text) speak(text, wantedEnd);
    }, () => {});
  });
}

/* --- мотор мотоцикла --- */
function engineStart() {
  if (!ac || engine) return;
  const g = ac.createGain(), f = ac.createBiquadFilter();
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  g.gain.value = 0.0001;
  f.type = 'lowpass'; f.frequency.value = 650;
  o1.type = 'sawtooth'; o1.frequency.value = 70;
  o2.type = 'square'; o2.frequency.value = 35.5;
  lfo.frequency.value = 17; lg.gain.value = 0.03;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination);
  lfo.connect(lg); lg.connect(g.gain);
  o1.start(); o2.start(); lfo.start();
  engine = { g, o1, o2, lfo };
}
function engineTo(freq, vol, time) {
  if (!engine) return;
  const t = ac.currentTime;
  [[engine.o1.frequency, freq], [engine.o2.frequency, freq * .507], [engine.g.gain, vol]].forEach(([p, v]) => {
    p.cancelScheduledValues(t);
    p.setValueAtTime(p.value, t);
    p.linearRampToValueAtTime(v, t + time);
  });
}
function engineStop(time) {
  if (!engine) return;
  const e = engine, t = ac.currentTime;
  engine = null;
  e.g.gain.cancelScheduledValues(t);
  e.g.gain.setValueAtTime(e.g.gain.value, t);
  e.g.gain.linearRampToValueAtTime(0.0001, t + time);
  [e.o1, e.o2, e.lfo].forEach(o => o.stop(t + time + 0.05));
}

/* ---------- ответ голосом: распознавание речи Safari ---------- */
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('#mic'), heard = $('#heard');
// дети говорят нечётко, а распознавание путает короткие слова, поэтому берём и похожие
const HE_WORDS = ['он', 'вон', 'онн'];
const SHE_WORDS = ['она', 'ана', 'анна', 'онна', 'вона'];
let rec = null, listenWanted = false, needTap = false, heardUntil = 0;

// true — «он», false — «она», null — не разобрали (тогда не ругаем, а слушаем дальше)
function decide(text) {
  const words = text.toLowerCase().replace(/ё/g, 'е').split(/[^а-яa-z]+/);
  const he = words.some(w => HE_WORDS.includes(w)), she = words.some(w => SHE_WORDS.includes(w));
  return he === she ? null : he;
}

function showHeard(text) {
  heard.textContent = text;
  heard.classList.remove('hidden');
  heardUntil = T + 3;
}

function startListening() {
  if (!Recognition || phase !== 'ask' || pose === 'kiss' || pose === 'thumb') return;
  listenWanted = true;
  if (rec) return;
  const r = new Recognition();
  r.lang = 'ru-RU';
  r.interimResults = true;
  r.maxAlternatives = 5;
  r.continuous = false;
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      showHeard('🎤 ' + res[0].transcript);
      if (!res.isFinal) continue;   // «он» — начало слова «она», поэтому ждём конца фразы
      for (let j = 0; j < res.length; j++) {
        const d = decide(res[j].transcript);
        if (d !== null) { stopListening(); answer(d); return; }
      }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      listenWanted = false;
      needTap = true;
      mic.classList.add('need');
    }
  };
  r.onend = () => {
    if (rec !== r) return;
    rec = null;
    mic.classList.remove('listening');
    // Safari сам останавливается после паузы — слушаем снова, пока нет ответа
    if (listenWanted) setTimeout(() => { if (listenWanted && !rec) startListening(); }, 300);
  };
  try {
    r.start();
    rec = r;
    mic.classList.add('listening');
  } catch (e) {
    needTap = true;
    mic.classList.add('need');
  }
}

function stopListening() {
  listenWanted = false;
  if (!rec) return;
  const r = rec;
  rec = null;
  mic.classList.remove('listening');
  try { r.abort(); } catch (e) {}
}

// после вопроса слушаем сами; если Safari не разрешает без касания — ждём нажатия на микрофон
const listenAfterVoice = () => { if (!needTap) startListening(); };

function micTap() {
  unlockAudio();
  needTap = false;
  mic.classList.remove('need');
  if (phase === 'ask') { stopVoice(); startListening(); }
}
if (!Recognition) mic.classList.add('hidden');
mic.addEventListener('click', e => { e.stopPropagation(); micTap(); });

function setupRig(root) {

    const [px, py] = nums(el, 'data-pivot');

  });
  const wheels = [...root.querySelectorAll('[data-wheel]')].map(el => {
    const [cx, cy] = nums(el, 'data-wheel');
    return { el, cx, cy };
  });
  const puffs = [...root.querySelectorAll('[data-puff]')].map(el => {
    const [x, y, i] = nums(el, 'data-puff');

  });
  const legs = [...root.querySelectorAll('[data-leg]')].map(el => {
    const [hx, hy, bx, by, crank, off, l1, l2] = nums(el, 'data-leg');
    return { el, shoe: el.nextElementSibling, hx, hy, bx, by, crank, off, l1, l2 };
  });
  const cranks = [...root.querySelectorAll('[data-crank]')].map(el => {
    const [bx, by, len, off] = nums(el, 'data-crank');
    return { el, bx, by, len, off };
  });

  // вид спереди: руки (две кости), голова, туловище, лица
  const fr = root.querySelector('[data-front]');
  const arm = side => {
    const el = fr.querySelector(`[data-arm="${side}"]`);
    const [sx, sy] = nums(el, 'data-sh'), [ua, fa] = nums(el, 'data-len');
    return { el, hand: fr.querySelector(`[data-hand="${side}"]`), sx, sy, ua, fa, out: side === 'R' ? 1 : -1, cur: null };
  };
  const torso = fr.querySelector('[data-torso]');
  const headEl = fr.querySelector('[data-head]');
  const [, hcy, hs] = nums(headEl, 'data-hc');
  const cane = fr.querySelector('[data-cane]');
  const front = {
    off: Number(fr.parentElement.getAttribute('data-off')),
    L: arm('L'), R: arm('R'),
    thumb: fr.querySelector('[data-thumb]'),
    torso, torsoY: Number(torso.getAttribute('y')), torsoH: Number(torso.getAttribute('height')),
    head: headEl, neck: [0, hcy + 30 * hs], mouth: [0, hcy + 15 * hs],
    faces: Object.fromEntries([...fr.querySelectorAll('[data-face]')].map(el => [el.getAttribute('data-face'), el])),

    face: 'smile', drop: 0, headDrop: 0, tilt: 0, bounce: 0,

  return { views, limbs, wheels, puffs, legs, cranks, front };

function drawPedals(rig, angle) {
  for (const c of rig.cranks) {
    const a = angle + c.off;
    c.el.setAttribute('d', `M${c.bx},${c.by} L${(c.bx + c.len * Math.cos(a)).toFixed(1)},${(c.by + c.len * Math.sin(a)).toFixed(1)}`);
  }
  for (const l of rig.legs) {
    const a = angle + l.off;
    const fx = l.bx + l.crank * Math.cos(a), fy = l.by + l.crank * Math.sin(a);
    const [knee] = ik(l.hx, l.hy, fx, fy, l.l1, l.l2, 1);
    l.el.setAttribute('d', `M${l.hx},${l.hy} L${knee[0].toFixed(1)},${knee[1].toFixed(1)} L${fx.toFixed(1)},${fy.toFixed(1)}`);
    l.shoe.setAttribute('cx', (fx + 4).toFixed(1));
    l.shoe.setAttribute('cy', fy.toFixed(1));
  }
}

// Сустав (локоть или колено) для двух костей l1, l2 от точки (sx,sy) к цели.
// side: +1 — сустав правее линии, -1 — левее
function ik(sx, sy, tx, ty, l1, l2, side) {
  const dx = tx - sx, dy = ty - sy, dist = Math.hypot(dx, dy) || 1e-6;
  const ux = dx / dist, uy = dy / dist;
  const d = Math.min(Math.max(dist, Math.abs(l1 - l2) + .01), l1 + l2 - .01);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const px = sx + ux * a, py = sy + uy * a;
  const e1 = [px - uy * h, py + ux * h], e2 = [px + uy * h, py - ux * h];
  return [(e1[0] - e2[0]) * side > 0 ? e1 : e2, [sx + ux * d, sy + uy * d]];
}

// куда тянутся руки и как выглядит лицо в каждой позе
function frontTargets(f, pose, tG) {
  const A = f.R.ua + f.R.fa;
  const rest = a => {
    if (a.out < 0 && f.cane) return f.cane;
    if (f.lap) return [a.sx * .55, f.hip - 6];
    return [a.sx + a.out * 2, a.sy + A * .95];
  };
  const p = { L: rest(f.L), R: rest(f.R), drop: 0, headDrop: 0, tilt: 0, face: 'smile', thumb: false, bounce: 0 };
  if (pose === 'kiss') {
    if (tG < .8) {                       // ладонь к губам
      p.R = [f.mouth[0] + 3, f.mouth[1] + 3];
      p.face = tG > .25 ? 'kiss' : 'smile';
    } else if (tG < 2.1) {               // посылает поцелуй
      p.R = [f.R.sx + A * .55, f.R.sy - A * .55];
      p.face = 'joy';
    }
  } else if (pose === 'thumb') {
    if (tG < 2.1) {
      p.R = [f.R.sx + A * .3, f.R.sy - A * .12];
      p.thumb = tG > .15;
      p.face = 'joy';
      p.bounce = tG < .6 ? Math.abs(Math.sin(tG * 10)) * 5 : 0;
    }
  } else if (pose === 'sad') {
    p.drop = 6; p.headDrop = 7; p.tilt = 9; p.face = 'sad';
    if (!f.lap) {
      if (!f.cane) p.L = [p.L[0] + 3, p.L[1] + 6];
      p.R = [p.R[0] - 3, p.R[1] + 6];
    }
  }
  return p;
}

function drawFront(f, pose, tG, dt) {
  const p = frontTargets(f, pose, tG);
  const r = Math.min(1, dt * 12), rs = Math.min(1, dt * 7);
  f.drop = lerp(f.drop, p.drop, rs);
  f.headDrop = lerp(f.headDrop, p.headDrop, rs);
  f.tilt = lerp(f.tilt, p.tilt, rs);
  f.bounce = p.bounce;
  for (const side of ['L', 'R']) {
    const a = f[side], t = p[side];
    a.cur = a.cur ? [lerp(a.cur[0], t[0], r), lerp(a.cur[1], t[1], r)] : t.slice();
    const sy = a.sy + f.drop;
    const [elbow, hand] = ik(a.sx, sy, a.cur[0], a.cur[1], a.ua, a.fa, a.out);
    a.el.setAttribute('d', `M${a.sx},${sy.toFixed(1)} L${elbow[0].toFixed(1)},${elbow[1].toFixed(1)} L${hand[0].toFixed(1)},${hand[1].toFixed(1)}`);
    a.hand.setAttribute('cx', hand[0].toFixed(1));
    a.hand.setAttribute('cy', hand[1].toFixed(1));
    a.at = hand;
  }
  if (f.thumb) {
    f.thumb.setAttribute('display', p.thumb ? 'inline' : 'none');
    f.R.hand.setAttribute('display', p.thumb ? 'none' : 'inline');
    f.thumb.setAttribute('transform', `translate(${f.R.at[0].toFixed(1)} ${f.R.at[1].toFixed(1)})`);
  }
  f.torso.setAttribute('y', (f.torsoY + f.drop).toFixed(1));
  f.torso.setAttribute('height', (f.torsoH - f.drop).toFixed(1));
  f.head.setAttribute('transform',
    `translate(0 ${(f.drop + f.headDrop).toFixed(1)}) rotate(${f.tilt.toFixed(1)} ${f.neck[0]} ${f.neck[1]})`);
  if (p.face !== f.face) {
    f.faces[f.face].setAttribute('display', 'none');
    f.faces[p.face].setAttribute('display', 'inline');
    f.face = p.face;
  }
  if (f.face === 'sad') {
    const q = (T * 1.1) % 1;
    f.tear.setAttribute('cy', (4 + q * 18).toFixed(1));
    f.tear.setAttribute('opacity', (1 - q).toFixed(2));
  }
}

// поворот: 0 — вид сбоку, 1 — вид спереди; половинки «сплющиваются» к середине
function applyTurn(q) {
  for (const v of rig.views) {
    const s = v.front ? 2 * q - 1 : 1 - 2 * q;
    if (s <= 0) { v.el.setAttribute('display', 'none'); continue; }
    v.el.setAttribute('display', 'inline');
    v.el.setAttribute('transform', s >= 1 ? '' : `translate(${v.cx} 0) scale(${s.toFixed(3)} 1) translate(${-v.cx} 0)`);
  }
}

/* ---------- сердечки и звёздочки ---------- */
const HEART = '<path d="M0,-4 C-5,-12 -16,-10 -15,-1 C-14,6 -5,11 0,16 C5,11 14,6 15,-1 C16,-10 5,-12 0,-4 Z" fill="#e91e63" stroke="#fff" stroke-width="2"/>';
const STAR = '<path d="M0,-16 L4.5,-5 L16,-5 L7,2 L10,14 L0,7 L-10,14 L-7,2 L-16,-5 L-4.5,-5 Z" fill="#ffca28" stroke="#fff" stroke-width="2"/>';
const particles = [];

function spawnFx(shape, lx, ly, opts) {
  const el = document.createElementNS(SVG_NS, 'g');
  el.innerHTML = shape;
  fxG.appendChild(el);
  particles.push({ el, x: x + (rig.front.off + lx) * k, y: ground + yNow + ly * k, t: 0, ...opts });
}

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    const q = p.t / p.dur;
    if (q >= 1) { p.el.remove(); particles.splice(i, 1); continue; }
    const s = lerp(p.s0, p.s1, Math.sqrt(q)) * k;
    p.el.setAttribute('transform', `translate(${(p.x + p.dx * q * k).toFixed(1)} ${(p.y - p.rise * q * k).toFixed(1)}) scale(${s.toFixed(3)})`);
    p.el.setAttribute('opacity', (q < .7 ? 1 : (1 - q) / .3).toFixed(2));
  }
}

/* ---------- ход игры ---------- */
// start | in | turn | ask | turnBack | out | gone
let phase = 'start';
let cur = null, rig = null, pose = 'idle';
let T = 0, tPhase = 0, gaitT = 0, tG = 0, askAgainAt = 0;
let x = 0, x0 = 0, yNow = 0, wheelA = 0, pedalA = 0, lastX = 0;
let fxDone = {};

const margin = () => 130 * k;

let bag = [], lastId = null;
function nextCharacter() {
  if (!bag.length) {
    bag = CHARACTERS.slice();
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    if (bag[bag.length - 1].id === lastId) bag.unshift(bag.pop());
  }
  const c = bag.pop(); lastId = c.id; return c;
}

function setButtons(on) { controls.classList.toggle('off', !on); }

function enter() {
  engineStop(0.15);
  cur = nextCharacter();
  actor.innerHTML = `<g>${cur.svg}</g>`;
  rig = setupRig(actor.firstElementChild);
  phase = 'in'; tPhase = 0; gaitT = 0; pose = 'idle';
  x = x0 = lastX = -margin();
  wheelA = 0; pedalA = 0;
  drawPedals(rig, pedalA);
  applyTurn(0);
  shadow.removeAttribute('display');
  setButtons(false);
  if (cur.engine) { engineStart(); engineTo(85, 0.16, 0.2); }
}

function answer(he) {
  if (phase !== 'ask' || pose === 'kiss' || pose === 'thumb') return;
  stopListening();
  tG = 0; fxDone = {};
  askAgainAt = T + 12;
  if (he === cur.he) {
    pose = cur.he ? 'thumb' : 'kiss';
    setButtons(false);
    speak(cur.he ? SAY.goodHe : SAY.goodShe);
  } else {
    pose = 'sad';
    speak(SAY.retry, listenAfterVoice);
  }
}

function bindAnswer(btn, he) {
  btn.addEventListener('pointerdown', e => {
    e.stopPropagation();
    unlockAudio();
    btn.classList.add('down');
    answer(he);
  });
  const up = () => btn.classList.remove('down');
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
}
bindAnswer(btnHe, true);
bindAnswer(btnShe, false);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') answer(true);
  if (e.key === 'ArrowRight') answer(false);
});

// На iOS звук разрешается только из touchend/click, а не из pointerdown
function onTap() {
  unlockAudio();
  if (phase !== 'start') return;
  $('#start').classList.add('hidden');
  controls.classList.remove('hidden');
  layout();
  enter();
}
document.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.target.closest && e.target.closest('#mic')) micTap(); else onTap();
}, { passive: false });
document.addEventListener('click', onTap);

function limbTarget(role, g, moving) {
  if (!moving) return 0;
  const s = Math.sin(gaitT * g.freq);
  if (g.hops) {
    if (role === 'legF') return g.amp * s;
    if (role === 'legB') return -g.amp * s;
    return role === 'armF' ? -150 : -130;
  }
  if (role === 'legF') return g.amp * s;
  if (role === 'legB') return -g.amp * s;
  if (role === 'armF') return -g.amp * .8 * s;
  return g.amp * .8 * s;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  T += dt;

  for (const c of clouds) {
    const s = c.s * u;
    c.fx -= 8 * s * dt / W;
    if (c.fx * W < -100 * s) c.fx = (W + 100 * s) / W;
    c.el.setAttribute('transform', `translate(${(c.fx * W).toFixed(1)} ${(c.fy * H).toFixed(1)}) scale(${s.toFixed(3)})`);
  }
  updateFx(dt);
  if (heardUntil && T > heardUntil) { heard.classList.add('hidden'); heardUntil = 0; }

  if (rig) step(dt);
  requestAnimationFrame(frame);
}

function step(dt) {
  const moving = phase === 'in' || phase === 'out';
  const st = moving ? cur[phase] : null;
  const g = st ? GAITS[st.gait] : GAITS.ride;
  let y = 0;
  tPhase += dt;

  if (moving) {
    gaitT += dt;
    const p = Math.min(1, tPhase / st.dur);
    x = phase === 'in' ? lerp(x0, W / 2, p * (2 - p)) : lerp(x0, W + margin(), st.accel ? p * p : p);
    y = g.hops
      ? -Math.abs(Math.sin(Math.PI * g.hops * p)) * g.height * k
      : -Math.abs(Math.sin(gaitT * g.freq)) * g.bob * k;
    if (p >= 1) {
      if (phase === 'in') {
        phase = 'turn'; tPhase = 0;
        if (cur.engine) engineTo(42, 0.05, 0.6);
      } else {
        phase = 'gone'; tPhase = 0;
        engineStop(0.5);
        actor.innerHTML = '';
        shadow.setAttribute('display', 'none');
        return;
      }
    }
  } else if (phase === 'gone') {
    if (tPhase > 0.5) enter();
    return;
  } else {
    x = W / 2;
    y = Math.sin(T * 2.5) * k;
  }

  if (phase === 'turn' || phase === 'turnBack') {
    const q = Math.min(1, tPhase / 0.4);
    applyTurn(phase === 'turn' ? q : 1 - q);
    if (q >= 1) {
      if (phase === 'turn') {
        phase = 'ask'; tPhase = 0; pose = 'idle';
        setButtons(true);
        speak(SAY.ask, listenAfterVoice);
        askAgainAt = T + 12;
      } else {
        phase = 'out'; tPhase = 0; gaitT = 0; x0 = x;
        if (cur.engine) { engineStart(); engineTo(190, 0.22, cur.out.dur * 0.8); }
      }
    }
  }

  if (phase === 'ask') {
    tG += dt;
    if (pose === 'sad' && tG > 2.2) pose = 'idle';
    if (pose === 'kiss' && tG > .85 && !fxDone.a) {
      fxDone.a = true; sfxPop();
      spawnFx(HEART, rig.front.R.at[0], rig.front.R.at[1], { dur: 1.4, s0: .5, s1: 1.8, rise: 90, dx: 30 });
    }
    if (pose === 'kiss' && tG > 1.1 && !fxDone.b) {
      fxDone.b = true;
      spawnFx(HEART, rig.front.R.at[0], rig.front.R.at[1], { dur: 1.4, s0: .4, s1: 1.4, rise: 70, dx: -10 });
    }
    if (pose === 'thumb' && tG > .35 && !fxDone.a) {
      fxDone.a = true; sfxPop();
      spawnFx(STAR, rig.front.R.at[0] + 14, rig.front.R.at[1] - 30, { dur: 1.2, s0: .3, s1: 1.5, rise: 50, dx: 12 });
    }
    if ((pose === 'kiss' || pose === 'thumb') && tG > 2.6) {
      phase = 'turnBack'; tPhase = 0;
    }
    if (pose === 'idle' && T > askAgainAt) {   // ребёнок отвлёкся — спросим ещё раз
      stopListening();
      speak(SAY.ask, listenAfterVoice);
      askAgainAt = T + 12;
    }
  }

  if (phase === 'ask' || phase === 'turn' || phase === 'turnBack') {
    drawFront(rig.front, phase === 'ask' ? pose : 'idle', tG, dt);
    y -= rig.front.bounce * k;
  }
  yNow = y;

  if (cur.engine) y += Math.sin(T * 47) * 0.8 * k;
  const moved = (x - lastX) / k;
  lastX = x;
  wheelA += moved / 28 * 57.3;
  pedalA += moved / 30 * 0.62;
  for (const w of rig.wheels) w.el.setAttribute('transform', `rotate(${(wheelA % 360).toFixed(1)} ${w.cx} ${w.cy})`);
  if (rig.legs.length) drawPedals(rig, pedalA);

  for (const l of rig.limbs) {
    l.a += (limbTarget(l.role, g, moving) - l.a) * Math.min(1, dt * 14);
    l.el.setAttribute('transform', `rotate(${l.a.toFixed(1)} ${l.px} ${l.py})`);
  }
  for (const f of rig.puffs) {
    const q = (T * (moving ? 1.4 : .6) + f.i / 3) % 1;
    f.el.setAttribute('cx', (f.x - q * 50).toFixed(1));
    f.el.setAttribute('cy', (f.y - q * 22).toFixed(1));
    f.el.setAttribute('r', (4 + q * 11).toFixed(1));
    f.el.setAttribute('opacity', (.8 * (1 - q)).toFixed(2));
  }

  actor.firstElementChild.setAttribute('transform', `translate(${x.toFixed(1)} ${(ground + y).toFixed(1)}) scale(${k.toFixed(3)})`);
  const lift = Math.min(1, -y / (70 * k));
  shadow.setAttribute('cx', x.toFixed(1));
  shadow.setAttribute('cy', ground.toFixed(1));
  shadow.setAttribute('rx', ((cur.wide ? 105 : 50) * k * (1 - lift * .5)).toFixed(1));
  shadow.setAttribute('ry', (8 * k * (1 - lift * .5)).toFixed(1));
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopListening();
    stopVoice();
    engineStop(0.05);
  }
});

// iOS: без зума, прокрутки и «резинки»
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// иконка для «На экран Домой»
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#90caf9'; g.fillRect(0, 0, 90, 180);
  g.fillStyle = '#f8bbd0'; g.fillRect(90, 0, 90, 180);
  g.font = '900 44px -apple-system, sans-serif'; g.textAlign = 'center';
  g.fillStyle = '#1565c0'; g.fillText('Он', 45, 105);
  g.fillStyle = '#d81b60'; g.fillText('Она', 135, 105);
  g.fillStyle = '#37474f'; g.fillText('?', 90, 160);
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
} catch (e) {}

window.__state = () => ({ phase, id: cur && cur.id, pose });   // для автотестов

layout();
requestAnimationFrame(frame);
})();
</script>
</body>
